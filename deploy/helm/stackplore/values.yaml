nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: ghcr.io/example/stackplore-api
    tag: '2.0.0-alpha.2'
    digest: ''
    pullPolicy: IfNotPresent
  publicOrigin: https://stackplore.example.com
  trustedProxyPrefixes: 10.0.0.0/8
  metricsAllowedPrefixes: 10.0.0.0/8
  existingSecret: stackplore-runtime
  databaseURLKey: database-url
  logRedactFields: []
  databaseTLS:
    enabled: false
    caSecretName: stackplore-postgres-ca
    caCertificateKey: ca.crt
  setup:
    enabled: false
    proofSecretKey: setup-bootstrap-proof
    expirySecretKey: setup-bootstrap-expires-at
  kubernetes:
    enabled: false
    namespaces: []
    clusterObservation: false
  webhook:
    enabled: false
    destinationReferenceId: webhook_primary
    urlSecretKey: webhook-url
    signingKeySecretKey: webhook-signing-key
  matrix:
    enabled: false
    destinationReferenceId: matrix_primary
    originSecretKey: matrix-origin
    roomIdSecretKey: matrix-room-id
    accessTokenSecretKey: matrix-access-token
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  persistence:
    storageClass: ''
    size: 1Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: stackplore.example.com
  tls:
    enabled: true
    secretName: stackplore-tls

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
