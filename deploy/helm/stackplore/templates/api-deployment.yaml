apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackplore.fullname" . }}-api
  labels:
    {{- include "stackplore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "stackplore.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "stackplore.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stackplore.fullname" . }}
      automountServiceAccountToken: {{ .Values.api.kubernetes.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-private-runtime
          image: {{ include "stackplore.image" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              root=/runtime-volume
              private="$root/private"
              uid="$(id -u)"
              if [ -e "$private" ] || [ -L "$private" ]; then
                test ! -L "$private"
                test -d "$private"
                test "$(stat -c %u "$private")" = "$uid"
              else
                mkdir -m 0700 "$private"
              fi
              chmod 0700 "$private"
              legacy="$root/.stackplore.auth-key"
              key="$private/.stackplore.auth-key"
              check_key() {
                test ! -L "$1"
                test -f "$1"
                test "$(stat -c %u:%h:%s "$1")" = "$uid:1:32"
              }
              if [ -e "$legacy" ] || [ -L "$legacy" ]; then
                check_key "$legacy"
                test ! -e "$key"
                test ! -L "$key"
                chmod 0600 "$legacy"
                mv -n "$legacy" "$key"
                test ! -e "$legacy"
              fi
              if [ -e "$key" ] || [ -L "$key" ]; then
                check_key "$key"
                chmod 0600 "$key"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: runtime
              mountPath: /runtime-volume
      containers:
        - name: api
          image: {{ include "stackplore.image" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: STACKPLORE_ENVIRONMENT
              value: production
            - name: STACKPLORE_HTTP_ADDRESS
              value: 0.0.0.0:8080
            - name: STACKPLORE_PUBLIC_ORIGIN
              value: {{ .Values.api.publicOrigin | quote }}
            - name: STACKPLORE_TRUSTED_PROXY_PREFIXES
              value: {{ .Values.api.trustedProxyPrefixes | quote }}
            - name: STACKPLORE_METRICS_ALLOWED_PREFIXES
              value: {{ .Values.api.metricsAllowedPrefixes | quote }}
            - name: STACKPLORE_DATA_DIRECTORY
              value: /var/lib/stackplore
            - name: STACKPLORE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.databaseURLKey }}
            - name: STACKPLORE_LOG_FORMAT
              value: json
            {{- if .Values.api.logRedactFields }}
            - name: STACKPLORE_LOG_REDACT_FIELDS
              value: {{ join "," .Values.api.logRedactFields | quote }}
            {{- end }}
            {{- if .Values.api.setup.enabled }}
            - name: STACKPLORE_SETUP_BOOTSTRAP_PROOF
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.setup.proofSecretKey }}
            - name: STACKPLORE_SETUP_BOOTSTRAP_EXPIRES_AT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.setup.expirySecretKey }}
            {{- end }}
            - name: STACKPLORE_KUBERNETES_ENABLED
              value: {{ .Values.api.kubernetes.enabled | quote }}
            {{- if .Values.api.kubernetes.enabled }}
            - name: STACKPLORE_KUBERNETES_NAMESPACES
              value: {{ join "," .Values.api.kubernetes.namespaces | quote }}
            - name: STACKPLORE_KUBERNETES_CLUSTER_OBSERVATION
              value: {{ .Values.api.kubernetes.clusterObservation | quote }}
            {{- end }}
            - name: STACKPLORE_WEBHOOK_ENABLED
              value: {{ .Values.api.webhook.enabled | quote }}
            {{- if .Values.api.webhook.enabled }}
            - name: STACKPLORE_WEBHOOK_DESTINATION_REFERENCE_ID
              value: {{ .Values.api.webhook.destinationReferenceId | quote }}
            - name: STACKPLORE_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.webhook.urlSecretKey }}
            - name: STACKPLORE_WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.webhook.signingKeySecretKey }}
            {{- end }}
            - name: STACKPLORE_MATRIX_ENABLED
              value: {{ .Values.api.matrix.enabled | quote }}
            {{- if .Values.api.matrix.enabled }}
            - name: STACKPLORE_MATRIX_DESTINATION_REFERENCE_ID
              value: {{ .Values.api.matrix.destinationReferenceId | quote }}
            - name: STACKPLORE_MATRIX_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.matrix.originSecretKey }}
            - name: STACKPLORE_MATRIX_ROOM_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.matrix.roomIdSecretKey }}
            - name: STACKPLORE_MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.matrix.accessTokenSecretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/stackplore
              subPath: private
            - name: tmp
              mountPath: /tmp
            {{- if .Values.api.databaseTLS.enabled }}
            - name: database-ca
              mountPath: /var/run/stackplore/database-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "stackplore.fullname" . }}-runtime
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        {{- if .Values.api.databaseTLS.enabled }}
        - name: database-ca
          secret:
            secretName: {{ .Values.api.databaseTLS.caSecretName | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.api.databaseTLS.caCertificateKey | quote }}
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
