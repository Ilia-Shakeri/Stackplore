{{- if .Values.api.kubernetes.enabled }}
{{- $root := . }}
{{- $reader := printf "%s-reader-%s" (include "stackplore.fullname" . | trunc 46 | trimSuffix "-") (printf "%s/%s" (include "stackplore.fullname" .) .Release.Namespace | sha256sum | trunc 8) }}
{{- range .Values.api.kubernetes.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $reader | quote }}
  namespace: {{ . | quote }}
  labels:
    {{- include "stackplore.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $reader | quote }}
  namespace: {{ . | quote }}
  labels:
    {{- include "stackplore.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $reader | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stackplore.fullname" $root | quote }}
    namespace: {{ $root.Release.Namespace | quote }}
{{- end }}
{{- if .Values.api.kubernetes.clusterObservation }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $reader | quote }}
  labels:
    {{- include "stackplore.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: {{ .Values.api.kubernetes.namespaces | toJson }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $reader | quote }}
  labels:
    {{- include "stackplore.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $reader | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stackplore.fullname" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
{{- end }}
