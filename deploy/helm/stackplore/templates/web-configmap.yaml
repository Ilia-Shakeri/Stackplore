apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stackplore.fullname" . }}-web
  labels:
    {{- include "stackplore.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      location /api/ {
        proxy_pass http://{{ include "stackplore.fullname" . }}-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
      }
      location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
      location = /readyz { proxy_pass http://{{ include "stackplore.fullname" . }}-api:8080/readyz; }
      location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
      location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
    }
