global
    maxconn 64
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    timeout connect 3s
    timeout client 25s
    timeout server 25s
    timeout http-request 5s
    timeout http-keep-alive 5s
    option http-server-close

frontend docker_observation
    bind :8443 ssl crt /run/stackplore-docker-proxy/server.pem ca-file /run/stackplore-docker-proxy/ca.pem verify required
    acl read_method method GET
    acl head_method method HEAD
    acl ping_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/_ping$
    acl has_query query -m found
    acl encoded_path path_sub %
    acl parent_path path_sub ..
    acl upgrade req.hdr(Upgrade) -m found
    acl transfer_encoding req.hdr(Transfer-Encoding) -m found
    acl request_body req.hdr_val(Content-Length) gt 0
    http-request deny deny_status 403 if encoded_path or parent_path or upgrade or transfer_encoding or request_body
    http-request deny deny_status 403 unless read_method or head_method ping_path
    acl simple_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/(info|version|images/json|networks|volumes)$
    acl inspect_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/containers/[a-f0-9]{64}/json$
    acl list_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/containers/json$
    acl list_query query -m str all=1
    acl stats_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/containers/[a-f0-9]{64}/stats$
    acl stats_query query -m str stream=false
    acl logs_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/containers/[a-f0-9]{64}/logs$
    acl logs_query query -m reg ^since=[0-9]+([.][0-9]{1,9})?&stderr=1&stdout=1&tail=[1-9][0-9]{0,2}&timestamps=1&until=[0-9]+([.][0-9]{1,9})?$
    acl logs_tail urlp(tail) -m int 1:200
    acl events_path path_reg ^(/v1[.](4[0-9]|5[0-6]))?/events$
    acl events_query query -m reg ^since=0&until=[0-9]+([.][0-9]{1,9})?$
    http-request deny deny_status 403 unless ping_path !has_query or simple_path !has_query or inspect_path !has_query or list_path list_query or stats_path stats_query or logs_path logs_query logs_tail or events_path events_query
    default_backend docker_engine

backend docker_engine
    server engine unix@/var/run/docker.sock
