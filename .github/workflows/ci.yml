name: verify

on:
  pull_request:
  push:
    branches: [main, 'v2/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  processor-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Install locked browser tooling on hosted runner
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @stackplore/web exec playwright install --with-deps chromium
      - name: Start only the owned patched PostgreSQL fixture
        run: bash scripts/start-test-postgres.sh start code
      - name: Verify pinned real processor and desktop application
        run: node scripts/check-hosted-processor-linux.mjs
      - name: Stop only the owned PostgreSQL fixture
        if: always()
        run: bash scripts/start-test-postgres.sh stop code
      - name: Retain metadata-only processor receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-processor-evidence
          path: .tmp/hosted-processor.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  processor-tool:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native processor launcher without starting a process or network
        shell: pwsh
        run: pwsh -NoProfile -File scripts/local-processor.test.ps1
      - name: Verify versioned browser evidence policy with synthetic archives
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-browser-evidence.test.ps1

  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      STACKPLORE_TEST_POSTGRES_IMAGE: stackplore-postgres:2.0.0-alpha.6.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: apps/api/go.sum
      - name: Enable package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install locked packages
        run: |
          corepack pnpm install --frozen-lockfile
          for attempt in 1 2 3; do
            if go -C apps/api mod download; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
      - name: Build patched database and start owned PostgreSQL fixture
        run: bash scripts/start-test-postgres.sh start code
      - name: Verify bounded investigation contracts on hosted runner
        run: go -C apps/api test ./internal/domain ./internal/runbook ./internal/incidentreport ./internal/contextbuilder ./internal/assistantplan ./internal/assistantservice ./internal/assistantevidence ./internal/assistantconversation ./internal/httpapi ./internal/inference ./internal/provider/inference
      - name: Verify selected incident history on owned PostgreSQL
        run: go -C apps/api test ./internal/postgres -run '^(TestIncident(Alert|Workload)History|TestIncidentHistoryMigration|TestReleaseUpgradeFromShippedPrefixes)'
      - name: Verify incident report transport and ownership on hosted runner
        run: |
          corepack pnpm --filter @stackplore/api-client typecheck
          corepack pnpm --filter @stackplore/web typecheck
          corepack pnpm --filter @stackplore/api-client exec vitest run src/assistant-report-response.test.ts src/assistant-history-response.test.ts
          corepack pnpm --filter @stackplore/web exec vitest run src/app/App.test.tsx src/features/product/overview-refresh.test.tsx src/routes/HelpPage.test.tsx src/features/assistant/AssistantWorkspacePage.test.tsx src/app/shell/CommandPalette.test.tsx src/test/ui-primitives.test.tsx src/test/branding-theme.test.ts src/test/ui-state.test.tsx src/i18n/locale-provider.test.tsx src/features/users/user-admin-flow.test.tsx src/features/auth/auth-flow.test.tsx src/features/product/DashboardLayout.test.tsx src/features/product/MetricTrend.test.tsx src/features/assistant/conversation-report.test.ts src/features/assistant/AssistantResourcePanel.test.tsx
      - name: Run full gate
        run: corepack pnpm verify
      - name: Prepare formatting correction after a failed gate
        if: failure()
        run: |
          mkdir -p .tmp
          corepack pnpm --filter @stackplore/api-client derive
          corepack pnpm exec prettier --write scripts/runtime-image-policy.mjs scripts/runtime-images.test.mjs apps/web/src/app/router.tsx apps/web/src/app/App.test.tsx apps/web/src/app/shell/navigation.ts apps/web/src/routes/RoutePages.tsx apps/web/src/routes/HelpPage.tsx apps/web/src/routes/HelpPage.test.tsx apps/web/src/i18n/catalog.ts apps/web/src/features/product/WorkspaceNavigation.tsx apps/web/src/features/product/workspace.messages.en.json apps/web/src/features/product/workspace.messages.fa.json apps/web/src/features/product/product-view-search.ts apps/web/src/features/product/overview-refresh.test.tsx apps/web/src/features/auth/PasswordChangeDialog.tsx apps/web/src/features/auth/UserMenu.tsx apps/web/src/features/auth/auth-flow.test.tsx apps/web/src/features/users/UserActionDialog.tsx apps/web/src/features/users/user-admin-flow.test.tsx apps/web/src/i18n/locale-provider.tsx apps/web/src/i18n/locale-provider.test.tsx packages/ui/src/theme/theme-provider.tsx apps/web/src/test/ui-state.test.tsx apps/web/tests/browser/release.spec.ts packages/ui/src/components/dialog.tsx packages/ui/src/styles/overlays.css packages/ui/src/styles/tokens.css apps/web/src/app/shell/CommandPalette.tsx apps/web/src/app/shell/CommandPalette.test.tsx packages/ui/src/styles/controls.css apps/web/src/features/product/DashboardLayout.tsx apps/web/src/features/product/DashboardLayout.test.tsx apps/web/src/features/product/ProductPages.tsx apps/web/src/features/product/trend.messages.en.json apps/web/src/features/product/trend.messages.fa.json apps/web/src/features/product/MetricTrend.tsx apps/web/src/features/product/MetricTrend.test.tsx apps/web/src/styles/app.css packages/ui/src/styles/themes.css contracts/openapi.yaml scripts/hosted-processor-observer.mjs scripts/hosted-processor-observer.test.mjs scripts/assistant-contract-policy.mjs packages/api-client/src/assistant-*.ts packages/api-client/src/contract.ts apps/web/src/features/assistant apps/web/tests/browser/normal-auth.spec.ts scripts/release.mjs scripts/release.test.mjs scripts/check-hosted-processor-linux.mjs scripts/check-hosted-processor-linux.test.mjs apps/web/tests/browser/assistant-live-journey.ts scripts/hosted-assistant-profile.mjs scripts/hosted-assistant-profile.test.mjs scripts/browser-gate.mjs
          node scripts/gofmt.mjs --write
          git diff --binary -- scripts/runtime-image-policy.mjs scripts/runtime-images.test.mjs apps/web/src/app/router.tsx apps/web/src/app/App.test.tsx apps/web/src/app/shell/navigation.ts apps/web/src/routes/RoutePages.tsx apps/web/src/routes/HelpPage.tsx apps/web/src/routes/HelpPage.test.tsx apps/web/src/i18n/catalog.ts apps/web/src/features/product/WorkspaceNavigation.tsx apps/web/src/features/product/workspace.messages.en.json apps/web/src/features/product/workspace.messages.fa.json apps/web/src/features/product/product-view-search.ts apps/web/src/features/product/overview-refresh.test.tsx apps/web/src/features/auth/PasswordChangeDialog.tsx apps/web/src/features/auth/UserMenu.tsx apps/web/src/features/auth/auth-flow.test.tsx apps/web/src/features/users/UserActionDialog.tsx apps/web/src/features/users/user-admin-flow.test.tsx apps/web/src/i18n/locale-provider.tsx apps/web/src/i18n/locale-provider.test.tsx packages/ui/src/theme/theme-provider.tsx apps/web/src/test/ui-state.test.tsx apps/web/tests/browser/release.spec.ts packages/ui/src/components/dialog.tsx packages/ui/src/styles/overlays.css packages/ui/src/styles/tokens.css apps/web/src/app/shell/CommandPalette.tsx apps/web/src/app/shell/CommandPalette.test.tsx packages/ui/src/styles/controls.css apps/web/src/features/product/DashboardLayout.tsx apps/web/src/features/product/DashboardLayout.test.tsx apps/web/src/features/product/ProductPages.tsx apps/web/src/features/product/trend.messages.en.json apps/web/src/features/product/trend.messages.fa.json apps/web/src/features/product/MetricTrend.tsx apps/web/src/features/product/MetricTrend.test.tsx apps/web/src/styles/app.css packages/ui/src/styles/themes.css apps/api/cmd/server/assistant_product.go apps/api/internal/assistant/runtime.go apps/api/internal/assistant/runtime_test.go apps/api/internal/postgres/incident_history_migration_test.go apps/api/internal/postgres/release_upgrade_integration_test.go apps/api/internal/domain/incident_history.go apps/api/internal/domain/incident_history_test.go apps/api/internal/postgres/incident_alert_history.go apps/api/internal/postgres/incident_alert_history_test.go apps/api/internal/postgres/incident_workload_history.go apps/api/internal/postgres/incident_workload_history_test.go contracts/openapi.yaml apps/api/internal/httpapi/assistant_report.go apps/api/internal/httpapi/assistant_report_test.go apps/api/internal/httpapi/router.go apps/api/internal/incidentreport apps/api/internal/runbook apps/api/internal/postgres/assistant_wire_integration_test.go scripts/hosted-processor-observer.mjs scripts/hosted-processor-observer.test.mjs scripts/assistant-contract-policy.mjs packages/api-client/src apps/web/src/features/assistant apps/web/tests/browser/normal-auth.spec.ts apps/api/internal/assistantconversation apps/api/internal/httpapi/assistant_contract.go apps/api/internal/httpapi/assistant_handlers.go apps/api/internal/httpapi/assistant_investigation_test.go apps/api/internal/assistantplan apps/api/internal/assistantservice apps/api/internal/assistantevidence apps/api/internal/contextbuilder apps/api/internal/inference apps/api/internal/provider/inference scripts/release.mjs scripts/release.test.mjs scripts/check-hosted-processor-linux.mjs scripts/check-hosted-processor-linux.test.mjs apps/web/tests/browser/assistant-live-journey.ts scripts/hosted-assistant-profile.mjs scripts/hosted-assistant-profile.test.mjs scripts/browser-gate.mjs apps/api/internal/provider/inference/local_integration_test.go apps/api/internal/provider/inference/local_evidence_integration_test.go apps/api/internal/inference/types.go apps/api/internal/inference/gateway.go apps/api/internal/inference/gateway_test.go apps/api/internal/provider/inference/local.go apps/api/internal/provider/inference/local_test.go apps/api/internal/config/assistant_profile.go apps/api/internal/config/assistant_profile_test.go apps/api/internal/provider/inference/profile.go > .tmp/source-format.patch
      - name: Retain source formatting correction
        if: failure() && hashFiles('.tmp/source-format.patch') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-format-patch
          path: .tmp/source-format.patch
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Run Go concurrency gate
        run: go -C apps/api test -race ./...
      - name: Run release tooling checks
        run: node --test scripts/release.test.mjs
      - name: Install pinned browser runtime
        run: corepack pnpm --filter @stackplore/web exec playwright install --with-deps chromium
      - name: Verify production browser and offline shell in disposable PostgreSQL
        run: node scripts/browser-gate.mjs
      - name: Validate canonical browser archive structure on hosted runner
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $proofZip = Join-Path $env:RUNNER_TEMP 'stackplore-browser-proof.zip'
          $files = @('.tmp/browser-results.json', '.tmp/browser-results-normal-en.json', '.tmp/browser-results-normal-fa.json', "docs/evidence/$version/browser-measurements.json")
          $files += @(Get-ChildItem -LiteralPath "docs/evidence/$version/screenshots" -Filter '*.png' -File | ForEach-Object { [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName).Replace('\', '/') })
          $archive = [IO.Compression.ZipFile]::Open($proofZip, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($entry in $files) {
              $null = [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, (Join-Path (Get-Location).Path $entry), $entry)
            }
          } finally { $archive.Dispose() }
          $validation = pwsh -NoProfile -File scripts/verify-browser-evidence.ps1 -Version $version -ValidateArchive $proofZip
          if ($LASTEXITCODE -ne 0) { throw 'Hosted browser archive validation failed.' }
          $proofDirectory = Join-Path (Get-Location).Path '.tmp/workspace-design'
          $null = [IO.Directory]::CreateDirectory($proofDirectory)
          [IO.File]::WriteAllText((Join-Path $proofDirectory 'archive-structure.json'), (($validation -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - name: Retain workspace interface diagnostics separately from canonical browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-interface-evidence
          path: |
            .tmp/workspace-design/*.png
            .tmp/workspace-design/*.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Retain sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: |
            .tmp/browser-results.json
            .tmp/browser-results-*.json
            .tmp/browser-measurements-*.json
            docs/evidence/*/browser-measurements.json
            docs/evidence/*/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Stop only the owned PostgreSQL fixture
        if: always()
        run: bash scripts/start-test-postgres.sh stop code

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: apps/api/go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.17.3
      - name: Validate Compose model
        run: docker compose --env-file deploy/compose.env.example config --quiet
      - name: Lint cluster chart
        run: helm lint deploy/helm/stackplore --strict
      - name: Verify chart naming and preserved runtime references
        run: node scripts/check-helm-contracts.mjs
      - name: Verify private runtime initialization and legacy key preservation
        run: bash scripts/check-runtime-volume.sh
      - name: Render reviewed chart profiles
        run: |
          helm template verify deploy/helm/stackplore >/dev/null
          helm template verify deploy/helm/stackplore --set api.setup.enabled=true --set api.kubernetes.enabled=true --set 'api.kubernetes.namespaces[0]=default' --set ingress.enabled=true >/dev/null
          helm template verify deploy/helm/stackplore --set api.kubernetes.enabled=true --set 'api.kubernetes.namespaces[0]=default' --set api.kubernetes.clusterObservation=true >/dev/null
          helm template verify deploy/helm/stackplore --set api.webhook.enabled=true --set api.matrix.enabled=true >/dev/null
          helm template verify deploy/helm/stackplore --set api.databaseTLS.enabled=true --set api.databaseTLS.caSecretName=verify-database-ca >/dev/null
          helm template verify deploy/helm/stackplore --set podAnnotations.test=verify >/dev/null
          helm template verify deploy/helm/stackplore --set 'api.logRedactFields[0]=customer_id' --set 'api.logRedactFields[1]=payment_ref' >/dev/null
          if helm template invalid-policy deploy/helm/stackplore --set 'api.logRedactFields[0]=not valid' >/dev/null 2>&1; then exit 1; fi
      - name: Verify long release names keep separate observation roles
        run: |
          reader_a="$(helm template stackplore-proof-with-a-long-name-shared-prefix-alpha deploy/helm/stackplore --set api.kubernetes.enabled=true --set 'api.kubernetes.namespaces[0]=default' --show-only templates/cluster-reader.yaml | awk '/^  name:/{print $2; exit}')"
          reader_b="$(helm template stackplore-proof-with-a-long-name-shared-prefix-beta deploy/helm/stackplore --set api.kubernetes.enabled=true --set 'api.kubernetes.namespaces[0]=default' --show-only templates/cluster-reader.yaml | awk '/^  name:/{print $2; exit}')"
          test -n "$reader_a" && test -n "$reader_b" && test "$reader_a" != "$reader_b"
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          tags: stackplore-api:verify
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  compose-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare disposable first-run configuration
        run: |
          password="$(openssl rand -hex 24)"
          proof="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          expires="$(date -u -d '+60 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "STACKPLORE_COMPOSE_DATABASE_PASSWORD=$password"
            echo "STACKPLORE_COMPOSE_DATABASE_URL=postgresql://stackplore:$password@postgres:5432/stackplore?sslmode=disable"
            echo "STACKPLORE_COMPOSE_PORT=18080"
            echo "STACKPLORE_SETUP_BOOTSTRAP_PROOF=$proof"
            echo "STACKPLORE_SETUP_BOOTSTRAP_EXPIRES_AT=$expires"
          } >> "$GITHUB_ENV"
      - name: Build and start fresh Compose install
        run: docker compose up --build -d
      - name: Verify UI, API, database migration, and restart persistence
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/readyz
          setup_status="$(curl --fail --silent --show-error http://localhost:18080/api/v1/setup/status)"
          printf '%s' "$setup_status" | jq -e '.state == "required" and .bootstrap_proof_required == true' >/dev/null
          cookie_jar="$RUNNER_TEMP/stackplore-smoke-cookies"
          preauth="$(curl --fail --silent --show-error -c "$cookie_jar" -H 'Origin: http://localhost:18080' -H 'Content-Type: application/json' -d '{"purpose":"setup"}' http://localhost:18080/api/v1/auth/preflight)"
          preauth_proof="$(printf '%s' "$preauth" | jq -er '.preauth_proof')"
          setup_body="$(jq -cn --arg proof "$STACKPLORE_SETUP_BOOTSTRAP_PROOF" '{login_name:"ci_operator",display_name:"CI Operator",password:"C1-Only-for-CI-Disposable-2026!",bootstrap_proof:$proof}')"
          curl --fail --silent --show-error -b "$cookie_jar" -c "$cookie_jar" -H 'Origin: http://localhost:18080' -H 'Content-Type: application/json' -H "X-Stackplore-Preauth: $preauth_proof" -d "$setup_body" http://localhost:18080/api/v1/setup >/dev/null
          closed_status="$(curl --fail --silent --show-error http://localhost:18080/api/v1/setup/status)"
          printf '%s' "$closed_status" | jq -e '.state == "closed"' >/dev/null
          page="$(curl --fail --silent --show-error http://127.0.0.1:18080/)"
          asset="$(printf '%s' "$page" | grep -oE '/assets/[^" ]+\.js' | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:18080$asset" >/dev/null
          curl --fail --silent --show-error -H 'Accept: text/html' http://127.0.0.1:18080/setup >/dev/null
          migration_count="$(docker compose exec -T postgres psql -U stackplore -d stackplore -Atc 'SELECT count(*) FROM schema_migrations')"
          test "$migration_count" -gt 0
          unset STACKPLORE_SETUP_BOOTSTRAP_PROOF STACKPLORE_SETUP_BOOTSTRAP_EXPIRES_AT
          docker compose up -d --force-recreate api
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/readyz
          migration_count_after="$(docker compose exec -T postgres psql -U stackplore -d stackplore -Atc 'SELECT count(*) FROM schema_migrations')"
          test "$migration_count" = "$migration_count_after"
          curl --fail --silent --show-error -b "$cookie_jar" http://localhost:18080/api/v1/auth/session >/dev/null
          test -n "$(curl --fail --silent --show-error -H 'Accept: text/html' http://127.0.0.1:18080/settings/application)"
      - name: Show bounded service diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 40 api
          docker compose logs --no-color --tail 20 postgres
      - name: Stop disposable Compose stack and remove its volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  helm-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.17.3
      - name: Install verified kind binary
        run: |
          mkdir -p "$RUNNER_TEMP/stackplore-tools"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 --output "$RUNNER_TEMP/stackplore-tools/kind"
          printf '%s  %s\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d "$RUNNER_TEMP/stackplore-tools/kind" | sha256sum --check --strict -
          curl --fail --silent --show-error --location --retry 2 --max-time 120 https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/stackplore-tools/kubectl"
          printf '%s  %s\n' 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8 "$RUNNER_TEMP/stackplore-tools/kubectl" | sha256sum --check --strict -
          chmod 0755 "$RUNNER_TEMP/stackplore-tools/kind"
          chmod 0755 "$RUNNER_TEMP/stackplore-tools/kubectl"
          echo "$RUNNER_TEMP/stackplore-tools" >> "$GITHUB_PATH"
      - name: Create isolated cluster and load application image
        run: |
          cluster_name="stackplore-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "STACKPLORE_INSTALL_KIND_NAME=$cluster_name" >> "$GITHUB_ENV"
          kind create cluster --name "$cluster_name" --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 180s
          docker build --file deploy/Dockerfile.postgres --tag stackplore-postgres:2.0.0-alpha.6.2 .
          kind load docker-image stackplore-postgres:2.0.0-alpha.6.2 --name "$cluster_name"
          docker build --file deploy/Dockerfile.api --tag stackplore-api:verify .
          kind load docker-image stackplore-api:verify --name "$cluster_name"
      - name: Validate long chart names against the Kubernetes API
        run: |
          for release_name in 123 true null yes stackplore-proof-with-a-long-name-shared-prefix-alpha stackplore-proof-with-a-long-name-shared-prefix-beta; do
            helm template "$release_name" deploy/helm/stackplore | kubectl apply --dry-run=server -f - >/dev/null
          done
          helm template override-proof deploy/helm/stackplore --set-string "fullnameOverride=$(printf 'a%.0s' $(seq 1 63))" | kubectl apply --dry-run=server -f - >/dev/null
          helm template numeric-proof deploy/helm/stackplore --set-string "fullnameOverride=1$(printf 'a%.0s' $(seq 1 62))" | kubectl apply --dry-run=server -f - >/dev/null
          for override in 123 true null yes; do
            helm template scalar-proof deploy/helm/stackplore --set-string "fullnameOverride=$override" | kubectl apply --dry-run=server -f - >/dev/null
          done
      - name: Prepare external PostgreSQL with verified TLS
        run: |
          test_dir="$RUNNER_TEMP/stackplore-helm-install"
          mkdir -m 0700 "$test_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$test_dir/ca.key" -out "$test_dir/ca.crt" -subj /CN=stackplore-disposable-test-ca -days 1
          openssl req -newkey rsa:2048 -nodes -keyout "$test_dir/server.key" -out "$test_dir/server.csr" -subj /CN=postgres.stackplore.svc.cluster.local
          printf 'subjectAltName=DNS:postgres.stackplore.svc.cluster.local\nextendedKeyUsage=serverAuth\n' > "$test_dir/server.ext"
          openssl x509 -req -in "$test_dir/server.csr" -CA "$test_dir/ca.crt" -CAkey "$test_dir/ca.key" -CAcreateserial -out "$test_dir/server.crt" -days 1 -extfile "$test_dir/server.ext"
          kubectl create namespace stackplore
          kubectl -n stackplore create secret generic postgres-tls --from-file=tls.crt="$test_dir/server.crt" --from-file=tls.key="$test_dir/server.key"
          kubectl -n stackplore create secret generic postgres-ca --from-file=ca.crt="$test_dir/ca.crt"
          db_password="$(openssl rand -hex 24)"
          db_url="postgresql://stackplore:${db_password}@postgres.stackplore.svc.cluster.local:5432/stackplore?sslmode=verify-full&sslrootcert=/var/run/stackplore/database-ca/ca.crt"
          proof="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          expires="$(date -u -d '+60 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          kubectl -n stackplore create secret generic stackplore-runtime --from-literal="database-url=$db_url" --from-literal="setup-bootstrap-proof=$proof" --from-literal="setup-bootstrap-expires-at=$expires"
          cat > "$test_dir/postgres.yaml" <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            namespace: stackplore
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                securityContext:
                  fsGroup: 70
                containers:
                  - name: postgres
                    image: stackplore-postgres:2.0.0-alpha.6.2
                    imagePullPolicy: Never
                    args: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/tls.crt", "-c", "ssl_key_file=/tls/tls.key"]
                    env:
                      - name: POSTGRES_DB
                        value: stackplore
                      - name: POSTGRES_USER
                        value: stackplore
                      - name: POSTGRES_PASSWORD
                        value: "PLACEHOLDER"
                    ports:
                      - name: postgres
                        containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "stackplore", "-d", "stackplore"]
                      initialDelaySeconds: 5
                      periodSeconds: 2
                    volumeMounts:
                      - name: tls
                        mountPath: /tls
                        readOnly: true
                      - name: data
                        mountPath: /var/lib/postgresql/data
                volumes:
                  - name: tls
                    secret:
                      secretName: postgres-tls
                      defaultMode: 0440
                  - name: data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
            namespace: stackplore
          spec:
            selector:
              app: postgres
            ports:
              - name: postgres
                port: 5432
                targetPort: postgres
          YAML
          sed -i "s/PLACEHOLDER/$db_password/" "$test_dir/postgres.yaml"
          kubectl apply -f "$test_dir/postgres.yaml"
          kubectl -n stackplore rollout status deployment/postgres --timeout=180s
      - name: Install Helm chart against external TLS database
        run: |
          test_dir="$RUNNER_TEMP/stackplore-helm-edge"
          mkdir -m 700 "$test_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=stackplore.test' -addext 'subjectAltName=DNS:stackplore.test' -keyout "$test_dir/tls.key" -out "$test_dir/tls.crt" >/dev/null 2>&1
          kubectl -n stackplore create secret tls stackplore-tls --cert="$test_dir/tls.crt" --key="$test_dir/tls.key"
          helm upgrade --install verify deploy/helm/stackplore \
            --namespace stackplore \
            --set api.image.repository=stackplore-api \
            --set api.image.tag=verify \
            --set api.image.pullPolicy=IfNotPresent \
            --set api.databaseTLS.enabled=true \
            --set api.databaseTLS.caSecretName=postgres-ca \
            --set api.databaseTLS.caCertificateKey=ca.crt \
            --set api.setup.enabled=true \
            --set api.publicOrigin=https://stackplore.test \
            --set ingress.enabled=true \
            --set ingress.host=stackplore.test \
            --wait --timeout 8m
          kubectl -n stackplore rollout status deployment/verify-stackplore-api --timeout=180s
          kubectl -n stackplore get ingress verify-stackplore -o json | jq -e '.spec.rules[0].host == "stackplore.test" and .spec.tls[0].hosts[0] == "stackplore.test" and .spec.tls[0].secretName == "stackplore-tls" and .spec.rules[0].http.paths[0].backend.service.name == "verify-stackplore-api" and .spec.rules[0].http.paths[0].backend.service.port.name == "http"' >/dev/null
          kubectl -n stackplore port-forward service/verify-stackplore-api 18081:80 > "$RUNNER_TEMP/stackplore-port-forward.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/stackplore-port-forward.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/readyz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18081/readyz
          page="$(curl --fail --silent --show-error -H 'Accept: text/html' http://127.0.0.1:18081/settings/application)"
          printf '%s' "$page" | grep -q 'Stackplore'
          kubectl -n stackplore get pods -o json | jq -e '[.items[] | select(.metadata.labels["app.kubernetes.io/component"] == "api") | .spec.containers[0].volumeMounts[] | select(.mountPath == "/var/run/stackplore/database-ca" and .readOnly == true)] | length == 1' >/dev/null
      - name: Show bounded cluster diagnostics on failure
        if: failure() && env.STACKPLORE_INSTALL_KIND_NAME != ''
        run: |
          kubectl -n stackplore get pods
          kubectl -n stackplore get events --field-selector type=Warning
          kubectl -n stackplore logs deployment/postgres --tail=30 || true
          kubectl -n stackplore logs deployment/verify-stackplore-api --tail=30 || true
      - name: Delete only the owned disposable cluster
        if: always() && env.STACKPLORE_INSTALL_KIND_NAME != ''
        run: |
          if test -f "$RUNNER_TEMP/stackplore-port-forward.pid"; then kill "$(cat "$RUNNER_TEMP/stackplore-port-forward.pid")" || true; fi
          kind delete cluster --name "$STACKPLORE_INSTALL_KIND_NAME"

  docker-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STACKPLORE_TEST_DOCKER_ENGINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: apps/api/go.sum
      - name: Verify restricted observation on disposable Engine
        run: go -C apps/api test ./internal/provider/docker -run TestRestrictedProxyOnRealDockerEngine -count=1 -timeout=9m -v

  kubernetes-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KUBERNETES_REQUIRED: '1'
      STACKPLORE_TEST_KUBE_DISPOSABLE: '1'
      STACKPLORE_TEST_KUBE_WRITES: '1'
      KIND_EXPERIMENTAL_PROVIDER: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache-dependency-path: apps/api/go.sum
      - name: Install verified kind binary
        run: |
          mkdir -p "$RUNNER_TEMP/stackplore-tools"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 --output "$RUNNER_TEMP/stackplore-tools/kind"
          printf '%s  %s\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d "$RUNNER_TEMP/stackplore-tools/kind" | sha256sum --check --strict -
          chmod 0755 "$RUNNER_TEMP/stackplore-tools/kind"
          echo "$RUNNER_TEMP/stackplore-tools" >> "$GITHUB_PATH"
      - name: Create owned disposable Kubernetes target
        run: |
          cluster_name="stackplore-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubeconfig_file="$RUNNER_TEMP/stackplore-provider-kubeconfig"
          echo "STACKPLORE_TEST_KIND_NAME=$cluster_name" >> "$GITHUB_ENV"
          echo "STACKPLORE_TEST_KUBECONFIG=$kubeconfig_file" >> "$GITHUB_ENV"
          kind create cluster --name "$cluster_name" --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$kubeconfig_file" --wait 180s
          chmod 0600 "$kubeconfig_file"
      - name: Verify namespace bounds with missing Metrics API on real Kubernetes
        run: go -C apps/api test ./internal/provider/kubernetes -run '^TestScopedSDKOnRealKubernetes$' -count=1 -timeout=8m -v
      - name: Install verified kubectl fixture tool
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 120 https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/stackplore-tools/kubectl"
          printf '%s  %s\n' 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8 "$RUNNER_TEMP/stackplore-tools/kubectl" | sha256sum --check --strict -
          chmod 0755 "$RUNNER_TEMP/stackplore-tools/kubectl"
      - name: Install pinned Metrics API on owned fixture
        run: bash scripts/install-test-metrics-server.sh
      - name: Verify fresh live usage with Metrics API on real Kubernetes
        env:
          STACKPLORE_TEST_KUBE_METRICS_PRESENT: '1'
        run: go -C apps/api test ./internal/provider/kubernetes -run '^TestScopedSDKWithMetricsOnRealKubernetes$' -count=1 -timeout=8m -v
      - name: Verify guarded writes on the owned disposable namespace
        run: go -C apps/api test ./internal/provider/kubernetes -run '^TestGuardedSDKWriterOnRealKubernetes$' -count=1 -timeout=8m -v
      - name: Delete only the owned disposable cluster
        if: always() && env.STACKPLORE_TEST_KIND_NAME != ''
        run: kind delete cluster --name "$STACKPLORE_TEST_KIND_NAME"
