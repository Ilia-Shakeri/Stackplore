name: stage9-lifecycle

on:
  push:
    branches: ['v2/**']
    tags: ['v*']
    paths:
      - '.github/workflows/stage9-lifecycle.yml'
      - 'scripts/check-stage9-lifecycle*.mjs'
      - 'apps/api/internal/assistantservice/**'
      - 'apps/api/internal/assistant/**'
      - 'apps/api/internal/inference/**'
      - 'apps/api/go.mod'
      - 'apps/api/go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage9-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  service-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.10
          cache-dependency-path: apps/api/go.sum
      - name: Check receipt completeness and privacy
        run: node --test scripts/check-stage9-lifecycle.test.mjs
      - name: Fetch pinned dependencies on hosted runner
        run: go -C apps/api mod download
      - name: Repeat eight service boundaries one hundred times with race detection
        run: node scripts/check-stage9-lifecycle.mjs
      - name: Retain metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage9-lifecycle
          path: .tmp/stage9-lifecycle.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
