    get:
      operationId: streamProductAlerts
      summary: Stream bounded alert snapshots
      description:
        Public only in an explicitly isolated guest demonstration; normal installations require a browser session. >-
        Source-scoped committed PostgreSQL changes with restart-stable decimal SSE IDs.
        alerts.snapshot.v1 data follows ProductAlertSnapshotEnvelope, a bounded first page.
        alerts.changed.v1 data follows ProductAlertChangesEnvelope and triggers HTTP refetch.
        Last-Event-ID replays retained changes; missing header starts a snapshot, while a
        future, absent-from-history or expired position resets then snapshots. A zero
        snapshot position clears the old cursor. Queue16, page100, frame256KiB, read10s,
        poll2s, keepalive15s, auth30s, lifetime30m, write5s; global64 and per-user4 caps.
        Backpressure closes that connection with reset when writable. Seven-day eligible
        bounded retention preserves the newest position; actual history may last longer.
      security:
        - BrowserSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProductSourceSelection'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          $ref: '#/components/responses/ProductEventStream'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
