              summary: Generic local sign-in rejection
              value:
                type: urn:stackplore:problem:invalid_credentials
                title: Sign in failed
                status: 401
                code: invalid_credentials
                request_id: req_demo_01
    ForbiddenProblem:
      description: The current principal cannot perform the request.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
