      required:
        - status
        - items
      properties:
        status:
          $ref: '#/components/schemas/UnavailableObservation'
        items:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/CurrentMetricSet'
    CurrentMetricResult:
      description: Current metric result split by whether the provider status allows data.
