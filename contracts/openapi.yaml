            - query
            - path
            - header
            - body
        name:
          $ref: '#/components/schemas/DisplayText'
          description: Bounded field name or JSON pointer.
          maxLength: 128
        code:
          $ref: '#/components/schemas/Code'
    Problem:
      type: object
      description: Safe consistent failure body.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI with no request data.
          minLength: 1
          maxLength: 256
          pattern: ^urn:stackplore:problem:[a-z][a-z0-9._-]{0,63}$
        title:
          $ref: '#/components/schemas/DisplayText'
          description: Fixed safe summary for the problem class.
          maxLength: 128
        status:
          type: integer
          description: HTTP status repeated for safe parsing.
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/Code'
        request_id:
          $ref: '#/components/schemas/RequestId'
        detail:
          $ref: '#/components/schemas/OptionalDisplayText'
          description: Optional fixed safe detail with no rejected value.
          maxLength: 1024
        invalid_parameters:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/InvalidParameter'
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional safe caller correlation identifier. Invalid values are replaced.
      schema:
        $ref: '#/components/schemas/RequestId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to normalized filter and sort state; its issuer owns forward progress.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      description: Requested result count, capped by the server.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Search:
      name: q
      in: query
      required: false
      description: Bounded plain-text search term, never a query expression.
      schema:
        $ref: '#/components/schemas/OptionalDisplayText'
        maxLength: 200
    ProviderFilter:
      name: provider
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 3
        items:
          $ref: '#/components/schemas/ProviderKind'
    SourceFilter:
      name: source_id
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/SourceId'
    EnvironmentFilter:
      name: environment_id
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/EnvironmentId'
    ResourceKindFilter:
      name: kind
      in: query
      required: false
      description: Repeated bounded resource kind codes use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/NamespacedCode'
    HealthFilter:
      name: health
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 4
        items:
          $ref: '#/components/schemas/HealthState'
    AvailabilityFilter:
      name: availability
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 5
        items:
          $ref: '#/components/schemas/AvailabilityState'
    From:
      name: from
      in: query
      required: false
      description: Inclusive UTC start of a bounded time range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      required: false
      description: Exclusive UTC end of a bounded time range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    SortDirection:
      name: direction
      in: query
      required: false
      description: Direction for the operation-owned sort field.
      schema:
        $ref: '#/components/schemas/SortDirection'
  headers:
    RequestId:
      description: Server-selected safe request correlation identifier.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    RetryAfter:
      description: Whole seconds before a bounded retry may be attempted.
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 86400
  responses:
    BadRequestProblem:
      description: The request is malformed or fails strict validation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              summary: Invalid request field
              value:
                type: urn:stackplore:problem:validation_failed
                title: Invalid request
                status: 400
                code: validation_failed
                request_id: req_demo_01
                invalid_parameters:
                  - location: query
                    name: limit
                    code: out_of_range
    UnauthorizedProblem:
      description: A valid local session is required.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              summary: Session required
              value:
                type: urn:stackplore:problem:unauthenticated
                title: Sign in required
                status: 401
                code: unauthenticated
                request_id: req_demo_01
    ForbiddenProblem:
      description: The current principal cannot perform the request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              summary: Request denied
              value:
                type: urn:stackplore:problem:forbidden
                title: Request not allowed
                status: 403
                code: forbidden
                request_id: req_demo_01
    NotFoundProblem:
      description: The requested safe identifier does not exist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              summary: Resource not found
              value:
                type: urn:stackplore:problem:not_found
                title: Not found
                status: 404
                code: not_found
                request_id: req_demo_01
    ConflictProblem:
      description: The request conflicts with the current stable state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            conflict:
              summary: Stable state conflict
              value:
                type: urn:stackplore:problem:conflict
                title: Request conflict
                status: 409
                code: conflict
                request_id: req_demo_01
    PayloadTooLargeProblem:
      description: The bounded request body limit was exceeded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            payloadTooLarge:
              summary: Request body too large
              value:
                type: urn:stackplore:problem:payload_too_large
                title: Request too large
                status: 413
                code: payload_too_large
                request_id: req_demo_01
    UnsupportedMediaTypeProblem:
      description: The request body media type is not supported.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupportedMediaType:
              summary: Unsupported request body
              value:
                type: urn:stackplore:problem:unsupported_media_type
                title: Unsupported media type
                status: 415
                code: unsupported_media_type
                request_id: req_demo_01
    TooManyRequestsProblem:
      description: A bounded request rate was exceeded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooManyRequests:
              summary: Retry after a bounded delay
              value:
                type: urn:stackplore:problem:rate_limited
                title: Too many requests
                status: 429
                code: rate_limited
                request_id: req_demo_01
    InternalProblem:
      description: The request failed without exposing internal detail.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              summary: Safe internal failure
              value:
                type: urn:stackplore:problem:internal
                title: Request failed
                status: 500
                code: internal
                request_id: req_demo_01
    ServiceUnavailableProblem:
      description: The service cannot complete the request now.
      headers:
        X-Request-ID:
