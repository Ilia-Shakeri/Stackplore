          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DockerPortMetadata'
        mounts:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DockerMountMetadata'
        labels:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/DockerLabelMetadata'
        cpu_limit_cores:
          type: number
          minimum: 0
          maximum: 1048576
          not:
            const: 0
        memory_limit_bytes:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    DockerPortMetadata:
      type: object
      additionalProperties: false
      required: [container_port, protocol, published]
      properties:
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        host_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp, sctp]
        published:
          type: boolean
      oneOf:
        - required: [host_port]
          properties:
            host_port:
              type: integer
              minimum: 1
              maximum: 65535
            published:
              const: true
        - not:
            required: [host_port]
            properties:
              host_port:
                type: integer
                minimum: 1
                maximum: 65535
          properties:
            published:
              const: false
    DockerMountMetadata:
      type: object
      additionalProperties: false
      required: [type, target, read_only]
      properties:
        type:
          type: string
          enum: [volume, bind, tmpfs]
        target:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^/'
        read_only:
          type: boolean
