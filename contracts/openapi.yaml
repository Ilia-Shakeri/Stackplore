                code: forbidden
                request_id: req_demo_01
    NotFoundProblem:
      description: The requested safe identifier does not exist.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
