        id:
          type: string
          description: Opaque operator identifier when one exists.
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
    SystemAuditActor:
      type: object
      description: System actor with no human identifier.
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          const: system
    AuditActor:
      description: Valid safe actor reference with no session data.
      oneOf:
        - $ref: '#/components/schemas/UserAuditActor'
        - $ref: '#/components/schemas/OperatorAuditActor'
