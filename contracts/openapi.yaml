      required:
        - id
        - rule_id
        - source_id
        - state
        - severity
        - started_at
        - updated_at
        - evidence_from
        - evidence_to
        - summary_code
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/AlertId'
        rule_id:
          $ref: '#/components/schemas/AlertRuleId'
        source_id:
          $ref: '#/components/schemas/SourceId'
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        state:
          type: string
          enum:
            - pending
            - firing
        severity:
          $ref: '#/components/schemas/EventSeverity'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        evidence_from:
          $ref: '#/components/schemas/Timestamp'
        evidence_to:
          $ref: '#/components/schemas/Timestamp'
        summary_code:
          $ref: '#/components/schemas/NamespacedCode'
        synthetic:
          type: boolean
          description: Whether the alert comes from demonstration data.
    AcknowledgedAlert:
      type: object
      description: Acknowledged alert with no resolution time.
      additionalProperties: false
      required:
        - id
        - rule_id
        - source_id
        - state
        - severity
        - started_at
        - updated_at
        - acknowledged_at
        - evidence_from
        - evidence_to
        - summary_code
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/AlertId'
        rule_id:
          $ref: '#/components/schemas/AlertRuleId'
        source_id:
          $ref: '#/components/schemas/SourceId'
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        state:
          type: string
          const: acknowledged
        severity:
          $ref: '#/components/schemas/EventSeverity'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        acknowledged_at:
          $ref: '#/components/schemas/Timestamp'
        evidence_from:
          $ref: '#/components/schemas/Timestamp'
        evidence_to:
          $ref: '#/components/schemas/Timestamp'
        summary_code:
          $ref: '#/components/schemas/NamespacedCode'
        synthetic:
          type: boolean
          description: Whether the alert comes from demonstration data.
    ResolvedAlert:
      type: object
      description: Resolved alert with an optional prior acknowledgement.
      additionalProperties: false
      required:
        - id
        - rule_id
        - source_id
        - state
        - severity
        - started_at
        - updated_at
        - resolved_at
        - evidence_from
        - evidence_to
        - summary_code
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/AlertId'
        rule_id:
          $ref: '#/components/schemas/AlertRuleId'
        source_id:
          $ref: '#/components/schemas/SourceId'
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        state:
          type: string
          const: resolved
        severity:
          $ref: '#/components/schemas/EventSeverity'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        acknowledged_at:
          $ref: '#/components/schemas/Timestamp'
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        evidence_from:
