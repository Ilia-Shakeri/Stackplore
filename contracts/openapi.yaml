      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          type: string
          enum: [com.docker.compose.project, com.docker.compose.service, stackplore.io/depends-on]
        value:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}(,[A-Za-z0-9][A-Za-z0-9_.-]{0,127}){0,31}$'
      oneOf:
        - properties:
            key:
              enum: [com.docker.compose.project, com.docker.compose.service]
            value:
              type: string
              minLength: 1
              maxLength: 128
              pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
        - properties:
            key:
              const: stackplore.io/depends-on
