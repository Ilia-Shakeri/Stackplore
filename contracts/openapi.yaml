        - outcome
        - request_id
        - summary_code
      properties:
        id:
          $ref: '#/components/schemas/AuditEntryId'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          $ref: '#/components/schemas/NamespacedCode'
        target:
          $ref: '#/components/schemas/AuditTarget'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        request_id:
          $ref: '#/components/schemas/RequestId'
        summary_code:
          $ref: '#/components/schemas/NamespacedCode'
    InventoryListCapability:
