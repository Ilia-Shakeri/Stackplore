        - $ref: '#/components/schemas/DataAllowedCurrentMetricResult'
        - $ref: '#/components/schemas/NoDataCurrentMetricResult'
    InfrastructureEvent:
      type: object
      description: Safe provider-neutral infrastructure timeline event.
      additionalProperties: false
      required:
        - id
        - source_id
        - provider
        - kind
        - severity
        - occurred_at
        - observed_at
        - summary_code
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        source_id:
          $ref: '#/components/schemas/SourceId'
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        kind:
          $ref: '#/components/schemas/NamespacedCode'
        severity:
          $ref: '#/components/schemas/EventSeverity'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        summary_code:
          $ref: '#/components/schemas/NamespacedCode'
        message:
          $ref: '#/components/schemas/OptionalDisplayText'
          description: Bounded event summary after safe filtering.
        synthetic:
          type: boolean
          description: Whether the event comes from demonstration data.
    DataAllowedEventPage:
      type: object
