    Capability:
      description: Current status of one known observation capability.
      oneOf:
        - $ref: '#/components/schemas/InventoryListCapability'
        - $ref: '#/components/schemas/InventoryDetailCapability'
        - $ref: '#/components/schemas/HealthReadCapability'
        - $ref: '#/components/schemas/TopologyReadCapability'
        - $ref: '#/components/schemas/LogReadCapability'
        - $ref: '#/components/schemas/LogTailCapability'
        - $ref: '#/components/schemas/MetricCurrentCapability'
        - $ref: '#/components/schemas/MetricHistoryCapability'
        - $ref: '#/components/schemas/EventHistoryCapability'
        - $ref: '#/components/schemas/EventWatchCapability'
    CapabilitySet:
      type: object
      description: Bounded observation capabilities for one source.
      additionalProperties: false
      required:
        - provider
        - source_id
        - items
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        source_id:
          $ref: '#/components/schemas/SourceId'
        items:
          type: array
          minItems: 10
          maxItems: 10
          prefixItems:
            - $ref: '#/components/schemas/InventoryListCapability'
            - $ref: '#/components/schemas/InventoryDetailCapability'
            - $ref: '#/components/schemas/HealthReadCapability'
            - $ref: '#/components/schemas/TopologyReadCapability'
            - $ref: '#/components/schemas/LogReadCapability'
            - $ref: '#/components/schemas/LogTailCapability'
            - $ref: '#/components/schemas/MetricCurrentCapability'
            - $ref: '#/components/schemas/MetricHistoryCapability'
            - $ref: '#/components/schemas/EventHistoryCapability'
            - $ref: '#/components/schemas/EventWatchCapability'
          items: false
    InvalidParameter:
      type: object
      description: Safe field failure that never repeats a rejected value.
      additionalProperties: false
      required:
        - location
        - name
        - code
      properties:
        location:
          type: string
          description: Request section containing the invalid field.
          enum:
            - query
            - path
            - header
            - body
        name:
          $ref: '#/components/schemas/DisplayText'
          description: Bounded field name or JSON pointer.
          maxLength: 128
        code:
          $ref: '#/components/schemas/Code'
    Problem:
      type: object
      description: Safe consistent failure body.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI with no request data.
          minLength: 1
          maxLength: 256
          pattern: ^urn:stackplore:problem:[a-z][a-z0-9._-]{0,63}$
        title:
          $ref: '#/components/schemas/DisplayText'
          description: Fixed safe summary for the problem class.
          maxLength: 128
        status:
          type: integer
          description: HTTP status repeated for safe parsing.
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/Code'
        request_id:
          $ref: '#/components/schemas/RequestId'
        detail:
          $ref: '#/components/schemas/OptionalDisplayText'
          description: Optional fixed safe detail with no rejected value.
          maxLength: 1024
        invalid_parameters:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/InvalidParameter'
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional safe caller correlation identifier. Invalid values are replaced.
      schema:
        $ref: '#/components/schemas/RequestId'
    UserId:
      name: user_id
      in: path
      required: true
      description: Stable opaque local user identifier.
      schema:
        $ref: '#/components/schemas/UserId'
    ResourceId:
      name: resource_id
      in: path
      required: true
      description: Stable provider-neutral resource identifier.
      schema:
        $ref: '#/components/schemas/ResourceId'
    ProductResourceFilter:
      name: resource_id
      in: query
      required: false
      description: Optional exact provider-neutral resource filter.
      schema:
        $ref: '#/components/schemas/ResourceId'
    ProductSourceSelection:
      name: source_id
      in: query
      required: false
      description: Selects one configured source. Omission selects the built-in demo source.
      schema:
        $ref: '#/components/schemas/SourceId'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last fully handled decimal event ID used for bounded replay after reconnect.
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^(?:0|[1-9][0-9]{0,19})$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted decimal form of the last observed entity version.
      schema:
        type: string
        minLength: 3
        maxLength: 18
        pattern: '^"[1-9][0-9]{0,15}"$'
    SourceSettingsId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SourceId'
    UserCursor:
      name: cursor
      in: query
      required: false
      description: Opaque local account continuation cursor, bounded separately from infrastructure cursors.
      schema:
        $ref: '#/components/schemas/Cursor'
        maxLength: 1024
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to normalized filter and sort state; its issuer owns forward progress.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      description: Requested result count, capped by the server.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Search:
      name: q
      in: query
      required: false
      description: Bounded plain-text search term, never a query expression.
      schema:
        $ref: '#/components/schemas/OptionalDisplayText'
        maxLength: 200
    UserRoleFilter:
      name: role
      in: query
      required: false
      description: Exact installation-wide role filter.
      schema:
        $ref: '#/components/schemas/UserRole'
    UserEnabledFilter:
      name: enabled
      in: query
      required: false
      description: Exact enabled-state filter.
      schema:
        type: boolean
    ProviderFilter:
      name: provider
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 3
        items:
          $ref: '#/components/schemas/ProviderKind'
    SourceFilter:
      name: source_id
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/SourceId'
    EnvironmentFilter:
      name: environment_id
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/EnvironmentId'
    ResourceKindFilter:
      name: kind
      in: query
      required: false
      description: Repeated bounded resource kind codes use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/NamespacedCode'
    HealthFilter:
      name: health
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 4
        items:
          $ref: '#/components/schemas/HealthState'
    AvailabilityFilter:
      name: availability
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 5
        items:
          $ref: '#/components/schemas/AvailabilityState'
    From:
      name: from
      in: query
      required: false
      description: Inclusive UTC start of a bounded time range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      required: false
      description: Exclusive UTC end of a bounded time range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    SortDirection:
      name: direction
      in: query
      required: false
      description: Direction for the operation-owned sort field.
      schema:
        $ref: '#/components/schemas/SortDirection'
  headers:
    BrowserStateUpdate:
      description: >-
        Optional host-only authentication cookie update. Setup or sign-in may clear a consumed
        pre-auth cookie. A route that reaches session authentication may repeat the opaque session
        cookie at the server-confirmed idle deadline, replace it after rotation, or clear it when
        the session is no longer valid. Each cookie uses HttpOnly, SameSite=Lax, Path=/api/v1, no
        Domain attribute, and Secure on HTTPS. A request rejected before either authentication
        boundary may omit this header.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    RequestId:
      description: Server-selected safe request correlation identifier.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    RetryAfter:
      description: Whole seconds before a bounded retry may be attempted.
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 86400
    EntityTag:
      description: Strong quoted decimal form of the returned user version.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 18
        pattern: '^"[1-9][0-9]{0,15}"$'
  responses:
    ProductEventStream:
      description: Authenticated bounded SSE feed. Snapshot and reset frames carry versioned JSON data.
      headers:
        Cache-Control:
          description: Prevents storage of transient infrastructure observations.
          schema:
            type: string
            const: no-cache, no-store
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Accel-Buffering:
          description: Disables reverse-proxy response buffering for this stream.
          schema:
            type: string
            const: 'no'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
