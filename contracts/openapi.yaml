              },
            'page': { '$ref': '#/components/schemas/PageInfo' },
          },
      }
  parameters:
    NotificationTestAdapter:
      name: adapter
      in: query
      required: false
      description: Exact operator-owned adapter lane; omission selects generic_webhook.
      schema:
        type: string
        enum: [generic_webhook, matrix]
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional safe caller correlation identifier. Invalid values are replaced.
      schema:
        $ref: '#/components/schemas/RequestId'
    UserId:
      name: user_id
      in: path
      required: true
      description: Stable opaque local user identifier.
      schema:
        $ref: '#/components/schemas/UserId'
    ResourceId:
      name: resource_id
      in: path
      required: true
      description: Stable provider-neutral resource identifier.
      schema:
        $ref: '#/components/schemas/ResourceId'
    ProductResourceFilter:
      name: resource_id
      in: query
      required: false
      description: Optional exact provider-neutral resource filter.
      schema:
        $ref: '#/components/schemas/ResourceId'
    ProductSourceSelection:
      name: source_id
      in: query
      required: false
      description: Selects one configured source. Omission selects the built-in demo source.
      schema:
        $ref: '#/components/schemas/SourceId'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last fully handled decimal event ID used for bounded replay after reconnect.
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: '^(?:0|[1-9][0-9]{0,19})$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted decimal form of the last observed entity version.
      schema:
        type: string
        minLength: 3
        maxLength: 18
        pattern: '^"[1-9][0-9]{0,15}"$'
    SourceSettingsId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SourceId'
    UserCursor:
      name: cursor
      in: query
      required: false
      description: Opaque local account continuation cursor, bounded separately from infrastructure cursors.
      schema:
        $ref: '#/components/schemas/Cursor'
        maxLength: 1024
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to normalized filter and sort state; its issuer owns forward progress.
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      required: false
      description: Requested result count, capped by the server.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Search:
      name: q
      in: query
      required: false
      description: Bounded plain-text search term, never a query expression.
      schema:
        $ref: '#/components/schemas/OptionalDisplayText'
        maxLength: 200
    UserRoleFilter:
      name: role
      in: query
      required: false
      description: Exact installation-wide role filter.
      schema:
        $ref: '#/components/schemas/UserRole'
    UserEnabledFilter:
      name: enabled
      in: query
      required: false
      description: Exact enabled-state filter.
      schema:
        type: boolean
    ProviderFilter:
      name: provider
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 3
        items:
          $ref: '#/components/schemas/ProviderKind'
    SourceFilter:
      name: source_id
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/SourceId'
    EnvironmentFilter:
      name: environment_id
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/EnvironmentId'
    ResourceKindFilter:
      name: kind
      in: query
      required: false
      description: Repeated bounded resource kind codes use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 64
        items:
          $ref: '#/components/schemas/NamespacedCode'
    HealthFilter:
      name: health
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 4
        items:
          $ref: '#/components/schemas/HealthState'
    AvailabilityFilter:
      name: availability
      in: query
      required: false
      description: Repeated values use OR semantics.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 5
        items:
          $ref: '#/components/schemas/AvailabilityState'
    From:
      name: from
      in: query
      required: false
      description: Inclusive UTC start; supplied together with to, with at most six fractional second digits.
      schema:
        type: string
        format: date-time
        minLength: 20
        maxLength: 27
        pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$
    To:
      name: to
      in: query
      required: false
      description: Exclusive UTC end; supplied together with from, with at most six fractional second digits and at most one minute in the future.
      schema:
        type: string
        format: date-time
        minLength: 20
        maxLength: 27
        pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$
    SortDirection:
      name: direction
      in: query
      required: false
      description: Direction for the operation-owned sort field.
      schema:
        $ref: '#/components/schemas/SortDirection'
    OperationId:
      {
        'name': 'operation_id',
        'in': 'path',
        'required': true,
        'description': 'One durable opaque operation identity.',
        'schema':
          {
            'type': 'string',
            'minLength': 1,
            'maxLength': 128,
            'pattern': '^[A-Za-z][A-Za-z0-9_-]{0,127}$',
          },
      }
    OperationIdempotencyKey:
      {
        'name': 'Idempotency-Key',
        'in': 'header',
        'required': true,
        'description': 'Opaque per-action key, bound by a keyed digest. Never place it in a URL or browser persistence.',
        'schema':
          {
            'type': 'string',
            'minLength': 1,
            'maxLength': 128,
            'pattern': '^[A-Za-z][A-Za-z0-9_-]{0,127}$',
          },
      }
  headers:
    BrowserStateUpdate:
      description: >-
        Optional host-only authentication cookie update. Setup or sign-in may clear a consumed
        pre-auth cookie. A route that reaches session authentication may repeat the opaque session
        cookie at the server-confirmed idle deadline, replace it after rotation, or clear it when
        the session is no longer valid. Each cookie uses HttpOnly, SameSite=Lax, Path=/api/v1, no
        Domain attribute, and Secure on HTTPS. A request rejected before either authentication
        boundary may omit this header.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    RequestId:
      description: Server-selected safe request correlation identifier.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    RetryAfter:
      description: Whole seconds before a bounded retry may be attempted.
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 86400
    EntityTag:
      description: Strong quoted decimal form of the returned user version.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 18
        pattern: '^"[1-9][0-9]{0,15}"$'
  responses:
    ProductEventStream:
      description: >-
        Authenticated bounded SSE feed. Snapshot JSON data is capped at 256 KiB.
        A larger legal snapshot emits a bounded stream.reset.v1 frame with reason
        snapshot_overflow so clients refetch the bounded REST page. The stream
        remains open; each changed oversized snapshot emits a new reset, while an
        unchanged snapshot emits none. Recovery to an in-budget snapshot resumes
        normal snapshot frames. Permission denial revokes transient replay and
        subscriptions independently of this size fallback.
      headers:
        Cache-Control:
          description: Prevents storage of transient infrastructure observations.
          schema:
            type: string
            const: no-cache, no-store
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Accel-Buffering:
          description: Disables reverse-proxy response buffering for this stream.
          schema:
            type: string
            const: 'no'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        text/event-stream:
          schema:
            type: string
            description: UTF-8 SSE frames with monotonic decimal IDs and single-line JSON data.
    UserCreated:
      description: Local user created.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
          examples:
            viewer:
              summary: New enabled viewer
              value:
                id: usr_demo_02
                login_name: viewer01
                display_name: On-call Viewer
                role: viewer
                enabled: true
                created_at: 2026-01-02T03:04:05Z
                updated_at: 2026-01-02T03:04:05Z
                version: 1
    UserFound:
      description: Current safe local user state.
      headers:
        ETag:
          $ref: '#/components/headers/EntityTag'
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
          examples:
            administrator:
              summary: Enabled administrator
              value:
                id: usr_demo_01
                login_name: operator
                display_name: Operations
                role: administrator
                enabled: true
                created_at: 2026-01-02T03:04:05Z
                updated_at: 2026-01-02T03:04:05Z
                version: 1
    MutationAccepted:
      description: The authenticated local state change completed.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    BadRequestProblem:
      description: The request is malformed or fails strict validation.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              summary: Invalid request field
              value:
                type: urn:stackplore:problem:validation_failed
                title: Invalid request
                status: 400
                code: validation_failed
                request_id: req_demo_01
                invalid_parameters:
                  - location: query
                    name: limit
                    code: out_of_range
    UnauthorizedProblem:
      description: A valid local session is required.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/BrowserStateUpdate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              summary: Session required
              value:
                type: urn:stackplore:problem:unauthenticated
                title: Sign in required
                status: 401
                code: unauthenticated
                request_id: req_demo_01
    SignInRejectedProblem:
      description: Local sign-in failed without disclosing account existence or state.
