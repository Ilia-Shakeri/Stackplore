        network.receive.bytes_total:
          $ref: '#/components/schemas/NetworkReceiveMetricSample'
        network.send.bytes_total:
          $ref: '#/components/schemas/NetworkSendMetricSample'
        restart.count:
          $ref: '#/components/schemas/RestartCountMetricSample'
        cpu.request.cores:
          $ref: '#/components/schemas/CpuRequestMetricSample'
        cpu.limit.cores:
          $ref: '#/components/schemas/CpuLimitMetricSample'
        memory.request.bytes:
          $ref: '#/components/schemas/MemoryRequestMetricSample'
        memory.limit.bytes:
          $ref: '#/components/schemas/MemoryLimitMetricSample'
    DataAllowedCurrentMetricSet:
