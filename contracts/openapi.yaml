            },
        },
    }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: stackplore_session
      description: >-
        Opaque host-only local session cookie. The server sets HttpOnly, SameSite=Lax,
        Path=/api/v1, no Domain attribute, and Secure when the public origin uses HTTPS.
    PreauthBrowserProof:
      type: apiKey
      in: cookie
      name: stackplore_preauth
      description: Opaque short-lived, one-use, host-only pre-auth cookie.
    PreauthRequestProof:
      type: apiKey
      in: header
      name: X-Stackplore-Preauth
      description: Separate one-use proof bound to the pre-auth cookie and exact purpose.
    CSRFRequestProof:
      type: apiKey
      in: header
      name: X-Stackplore-CSRF
      description: Session-bound proof required with exact same-origin metadata on unsafe requests.
    RecentAuthProof:
      type: apiKey
      in: header
      name: X-Stackplore-Recent-Auth
      description: Short-lived, one-use proof bound to user, session, and exact high-risk purpose.
  examples:
    AdministratorSession:
      summary: Safe administrator session context
      value:
        user:
          id: usr_demo_01
          login_name: operator
          display_name: Operations
          role: administrator
          enabled: true
          created_at: 2026-01-02T03:04:05Z
          updated_at: 2026-01-02T03:04:05Z
          version: 1
        csrf_proof: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        idle_expires_at: 2026-01-02T03:34:05Z
        absolute_expires_at: 2026-01-02T15:04:05Z
  schemas:
    SourceSettingsRecord:
      type: object
      additionalProperties: false
      required: [id, provider, name, synthetic, enabled, version, profile_available]
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        name:
          $ref: '#/components/schemas/DisplayText'
        synthetic:
          type: boolean
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        profile_available:
          type: boolean
    SourceSettingsPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SourceSettingsRecord'
        page:
          $ref: '#/components/schemas/PageInfo'
    SourcePreviewRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    SourceUpdateRequest:
      type: object
      additionalProperties: false
      required: [enabled, confirmation_token]
      properties:
        enabled:
          type: boolean
        confirmation_token:
          $ref: '#/components/schemas/Proof'
    SourceUpdatePreview:
      type: object
      additionalProperties: false
      required: [source, requested_enabled, impact, confirmation_token, expires_at]
      properties:
        source:
          $ref: '#/components/schemas/SourceSettingsRecord'
        requested_enabled:
          type: boolean
        impact:
          type: string
          enum: [collection.start, collection.stop]
        confirmation_token:
          $ref: '#/components/schemas/Proof'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    UserId:
      type: string
      description: Stable opaque local user identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - usr_demo_01
    LoginName:
      type: string
      description: Trimmed local login name compared by its lowercase ASCII canonical form.
      minLength: 3
      maxLength: 64
      pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._-]{1,62}[A-Za-z0-9])$'
      examples:
        - operator
    Passphrase:
      type: string
      format: password
      description: Input-only local passphrase of 12 to 128 UTF-8 bytes. The server and browser enforce the byte minimum; the schema maxLength is a separate safe transport character ceiling. The value is neither trimmed nor normalized.
      maxLength: 128
    Proof:
      type: string
      description: Short-lived opaque proof kept only in browser memory.
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
    UserRole:
      type: string
      description: Installation-wide version 1 role.
      enum:
        - administrator
        - viewer
    User:
      type: object
      description: Safe local user state with no credential or session material.
      additionalProperties: false
      required:
        - id
        - login_name
        - display_name
        - role
        - enabled
        - created_at
        - updated_at
        - version
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        login_name:
          $ref: '#/components/schemas/LoginName'
        display_name:
          $ref: '#/components/schemas/DisplayText'
        role:
          $ref: '#/components/schemas/UserRole'
        enabled:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          description: Optimistic concurrency version used to build the quoted If-Match value.
          minimum: 1
          maximum: 9007199254740991
    SetupState:
      type: string
      description: Permanently closed or currently available first-run network setup state.
      enum:
        - required
        - closed
    SetupStatus:
      description: Public sign-in choice or explicitly isolated read-only guest fixture.
      oneOf:
        - $ref: '#/components/schemas/NormalSetupStatus'
        - $ref: '#/components/schemas/GuestDemoStatus'
    GuestDemoStatus:
      type: object
      description: Public observation metadata without a user, session, or authentication proof.
      additionalProperties: false
      required: [state, fixture_version, scenario_step, observed_at]
      properties:
        state:
          type: string
          enum: [guest_demo]
        fixture_version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
        scenario_step:
          type: integer
          minimum: 0
          maximum: 2
        observed_at:
          $ref: '#/components/schemas/Timestamp'
    NormalSetupStatus:
      type: object
      description: Minimum public state needed to choose setup or sign-in.
      additionalProperties: false
      required:
        - state
        - bootstrap_proof_required
      properties:
        state:
          $ref: '#/components/schemas/SetupState'
        bootstrap_proof_required:
          type: boolean
    PreauthPurpose:
      type: string
      description: Exact operation that may consume one pre-auth proof.
      enum:
        - login
        - setup
    PreauthRequest:
      type: object
      description: Request for a bounded pre-auth proof.
      additionalProperties: false
      required:
        - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/PreauthPurpose'
    PreauthResponse:
      type: object
      description: One-use proof returned separately from its HttpOnly cookie.
      additionalProperties: false
      required:
        - preauth_proof
        - expires_at
      properties:
        preauth_proof:
          $ref: '#/components/schemas/Proof'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    SetupRequest:
      type: object
      description: First-administrator fields plus the optional operator bootstrap proof.
      additionalProperties: false
      required:
        - login_name
        - display_name
        - password
      properties:
        login_name:
          $ref: '#/components/schemas/LoginName'
        display_name:
          $ref: '#/components/schemas/DisplayText'
        password:
          $ref: '#/components/schemas/Passphrase'
        bootstrap_proof:
          $ref: '#/components/schemas/Proof'
          description: Operator-supplied one-use proof required only when setup status says so.
    LoginRequest:
      type: object
      description: Local sign-in fields with no setup or role input.
      additionalProperties: false
      required:
        - login_name
        - password
      properties:
        login_name:
          $ref: '#/components/schemas/LoginName'
        password:
          $ref: '#/components/schemas/Passphrase'
    SessionContext:
      type: object
      description: Safe current-user state plus a session-bound CSRF proof with no session identifier.
      additionalProperties: false
      required:
        - user
        - csrf_proof
        - idle_expires_at
        - absolute_expires_at
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_proof:
          $ref: '#/components/schemas/Proof'
        idle_expires_at:
          $ref: '#/components/schemas/Timestamp'
        absolute_expires_at:
          $ref: '#/components/schemas/Timestamp'
    RecentAuthPurpose:
      type: string
      description: Exact high-risk change bound to a one-use proof.
      enum:
        - account.password_change
        - user.create
        - user.update
        - user.delete
        - user.password_reset
        - user.sessions_revoke
        - notification.test
        - source.update
        - operation.execute
        - settings.update
        - configuration.export
        - data.cleanup
    RecentAuthRequest:
      type: object
      description: Current-password proof request for one exact high-risk purpose.
      additionalProperties: false
      required:
        - current_password
        - purpose
      properties:
        current_password:
          $ref: '#/components/schemas/Passphrase'
        purpose:
          $ref: '#/components/schemas/RecentAuthPurpose'
    RecentAuthResponse:
      type: object
      description: One-use proof bound to the current user, session, and purpose.
      additionalProperties: false
      required:
        - recent_auth_proof
        - purpose
        - expires_at
      properties:
        recent_auth_proof:
          $ref: '#/components/schemas/Proof'
        purpose:
          $ref: '#/components/schemas/RecentAuthPurpose'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    OwnPassphraseChangeRequest:
      type: object
      description: Input-only new password for the current user.
      additionalProperties: false
      required:
        - new_password
      properties:
        new_password:
          $ref: '#/components/schemas/Passphrase'
    CreateUserRequest:
      type: object
      description: Fields for one new enabled local user.
      additionalProperties: false
      required:
        - login_name
        - display_name
        - role
        - password
      properties:
        login_name:
          $ref: '#/components/schemas/LoginName'
        display_name:
          $ref: '#/components/schemas/DisplayText'
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          $ref: '#/components/schemas/Passphrase'
    UpdateUserRequest:
      type: object
      description: One or more reviewed local user fields.
      additionalProperties: false
      minProperties: 1
      maxProperties: 4
      properties:
        login_name:
          $ref: '#/components/schemas/LoginName'
        display_name:
          $ref: '#/components/schemas/DisplayText'
        role:
          $ref: '#/components/schemas/UserRole'
        enabled:
          type: boolean
    ResetPassphraseRequest:
      type: object
      description: Input-only replacement password for one managed local user.
      additionalProperties: false
      required:
        - new_password
      properties:
        new_password:
          $ref: '#/components/schemas/Passphrase'
    UserPage:
      type: object
      description: Bounded administrator-only user page with no total-count disclosure.
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageInfo'
    ReadinessState:
      type: string
      description: Current bounded readiness state.
      enum:
        - ready
        - not_ready
    ConfigurationReadinessCheck:
      type: object
      additionalProperties: false
      required:
        - name
        - state
      properties:
        name:
          type: string
          const: configuration
        state:
          $ref: '#/components/schemas/ReadinessState'
    DatabaseReadinessCheck:
      type: object
      additionalProperties: false
      required:
        - name
        - state
      properties:
        name:
          type: string
          const: database
        state:
          $ref: '#/components/schemas/ReadinessState'
    ServiceReadinessCheck:
      type: object
      additionalProperties: false
      required:
        - name
        - state
      properties:
        name:
          type: string
          const: service
        state:
          $ref: '#/components/schemas/ReadinessState'
    ProductResourceKind:
      type: string
      minLength: 3
      maxLength: 96
      pattern: ^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)+$
    HealthSummary:
      type: object
      additionalProperties: false
      required: [healthy, degraded, unhealthy, unknown]
      properties:
        healthy:
          type: integer
          minimum: 0
          maximum: 1000000
        degraded:
          type: integer
          minimum: 0
          maximum: 1000000
        unhealthy:
          type: integer
          minimum: 0
          maximum: 1000000
        unknown:
          type: integer
          minimum: 0
          maximum: 1000000
    SourceSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          provider,
          name,
          synthetic,
          observed_at,
          availability,
          completeness,
          resource_count,
          health,
        ]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
        provider:
          type: string
          enum: [demo, docker, kubernetes]
        name:
          type: string
          minLength: 1
          maxLength: 256
        synthetic:
          type: boolean
        fixture_version:
