    InvalidParameter:
      type: object
      description: Safe field failure that never repeats a rejected value.
      additionalProperties: false
      required:
        - location
        - name
        - code
      properties:
        location:
          type: string
          description: Request section containing the invalid field.
          enum:
            - query
            - path
            - header
            - body
        name:
          $ref: '#/components/schemas/DisplayText'
          description: Bounded field name or JSON pointer.
          maxLength: 128
        code:
          $ref: '#/components/schemas/Code'
    Problem:
      type: object
      description: Safe consistent failure body.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI with no request data.
          minLength: 1
          maxLength: 256
          pattern: ^urn:stackplore:problem:[a-z][a-z0-9._-]{0,63}$
        title:
          $ref: '#/components/schemas/DisplayText'
          description: Fixed safe summary for the problem class.
          maxLength: 128
        status:
          type: integer
          description: HTTP status repeated for safe parsing.
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/Code'
        request_id:
          $ref: '#/components/schemas/RequestId'
        detail:
          $ref: '#/components/schemas/OptionalDisplayText'
          description: Optional fixed safe detail with no rejected value.
          maxLength: 1024
        invalid_parameters:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/InvalidParameter'
