  /logs/download:
    get:
      operationId: downloadProductLogs
      summary: Stream a bounded redacted log download
      description: >-
        Public only in an explicitly isolated guest demonstration; normal installations require a browser session.
        Streams fixed source/resource/container and paired UTC time-range results across provider pages.
        Optional q and severity filters apply after the same redaction used for display.
        No cursor, limit, filename or endpoint override is accepted.
        The response is capped at 1048576 UTF-8 bytes including framing, 1000 matching records,
        10000 scanned records, 100 provider pages and ten seconds. Eight downloads globally
        and one per user or guest peer may run at once. The first line is
        '# Stackplore bounded log download v1'. Each record is a single timestamp-prefixed line.
        The final line is '# stackplore-export: complete', '# stackplore-export: limited',
        or '# stackplore-export: incomplete'. A missing or incomplete marker means the download failed;
        clients must not present it as complete. The range remains fixed through continuations.
      security:
        - BrowserSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProductSourceSelection'
        - $ref: '#/components/parameters/ProductResourceFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: container
          in: query
          description: Exact container name; requires resource_id.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,255}$
        - name: previous
          in: query
          description: Read the previous container instance; requires resource_id.
          schema:
            type: boolean
        - name: q
          in: query
          description: Case-insensitive search in redacted message text; control and direction-override characters are rejected.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/LogSeverity'
      responses:
        '200':
          description: Bounded UTF-8 streamed attachment. Inspect the final marker for complete or limited delivery.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/BrowserStateUpdate'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                const: 'attachment; filename="stackplore-logs.txt"'
          content:
            text/plain:
              schema:
                type: string
                maxLength: 1048576
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
