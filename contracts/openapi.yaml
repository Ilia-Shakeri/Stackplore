          type: integer
          description: Applied page limit.
          minimum: 1
          maximum: 200
        has_more:
          type: boolean
          const: true
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    FinalPageInfo:
      type: object
      description: Final page state with no continuation cursor.
      additionalProperties: false
      required:
