          $ref: '#/components/schemas/KubernetesResourceMetadata'
    DockerResourceMetadata:
      type: object
      additionalProperties: false
      required: [state, health, restart_count, ports, mounts, labels]
      properties:
        engine_version:
          type: string
          maxLength: 64
        state:
          type: string
          enum: [created, running, paused, restarting, exited, removing, dead, unknown]
        image:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,255}(@sha256:[a-f0-9]{64})?$'
        health:
          type: string
          enum: [healthy, unhealthy, starting, none, unknown]
        restart_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        started_at:
          type: string
          format: date-time
          minLength: 20
          maxLength: 27
          pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
        exit_code:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
