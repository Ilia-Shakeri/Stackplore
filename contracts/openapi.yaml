openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Stackplore API
  version: 2.0.0-alpha.1
  description: Provider-neutral transport shapes for the versioned Stackplore HTTP API.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: Same-origin version 1 API base path
paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Inspect first-run setup availability
      description: Returns only the state needed to choose setup or sign-in. It grants no setup authority.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current bounded network setup state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
              examples:
                setupRequired:
                  summary: First administrator setup is available
                  value:
                    state: required
                    bootstrap_proof_required: false
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /setup:
    post:
      operationId: createFirstAdministrator
      summary: Complete first-run administrator setup
      description: >-
        Atomically creates the only permitted first administrator and permanently closes network
        setup. Requires a one-use pre-auth proof, exact same-origin request metadata, and the
        operator bootstrap proof when the setup status requires one. The pre-auth cookie uses
        HttpOnly, SameSite=Lax, Path=/api/v1, no Domain attribute, and Secure on HTTPS.
      security:
        - PreauthBrowserProof: []
          PreauthRequestProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
            examples:
              localSetup:
                summary: Create the first local administrator
                value:
                  login_name: operator
                  display_name: Operations
                  password: correct-horse-demo
      responses:
        '201':
          description: Setup completed and a new local session was issued.
          headers:
            Set-Cookie:
              description: >-
                Opaque host-only session cookie. Uses HttpOnly, SameSite=Lax, Path=/api/v1, no
                Domain attribute, and Secure on HTTPS. The consumed pre-auth cookie is cleared.
              schema:
                type: string
                minLength: 1
                maxLength: 1024
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              examples:
                firstAdministrator:
                  $ref: '#/components/examples/AdministratorSession'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/preflight:
    post:
      operationId: createPreauthProof
      summary: Create a bounded pre-auth proof
      description: >-
        Creates a short-lived one-use proof for setup or sign-in. The proof grants no account or
        setup authority. The opaque cookie uses HttpOnly, SameSite=Lax, Path=/api/v1, no Domain
        attribute, and Secure on HTTPS. Exact same-origin request metadata is required.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreauthRequest'
            examples:
              signInProof:
                summary: Request a sign-in proof
                value:
                  purpose: login
      responses:
        '201':
          description: A bounded pre-auth proof was issued.
          headers:
            Set-Cookie:
              description: Opaque one-use host-only pre-auth cookie with the attributes above.
              schema:
                type: string
                minLength: 1
                maxLength: 1024
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreauthResponse'
              examples:
                issued:
                  summary: One-use proof issued
                  value:
                    preauth_proof: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    expires_at: 2026-01-02T03:09:05Z
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/login:
    post:
      operationId: login
      summary: Start a local user session
      description: >-
        Consumes the pre-auth cookie and X-Stackplore-Preauth proof. Unknown users, a wrong
        password, and disabled users receive the same bounded rejection. Exact same-origin request
        metadata is required.
      security:
        - PreauthBrowserProof: []
          PreauthRequestProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              localSignIn:
                summary: Sign in with a local account
                value:
                  login_name: operator
                  password: correct-horse-demo
      responses:
        '200':
          description: A new local session was issued.
          headers:
            Set-Cookie:
              description: >-
                Opaque host-only session cookie. Uses HttpOnly, SameSite=Lax, Path=/api/v1, no
                Domain attribute, and Secure on HTTPS. The consumed pre-auth cookie is cleared.
              schema:
                type: string
                minLength: 1
                maxLength: 1024
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              examples:
                administrator:
                  $ref: '#/components/examples/AdministratorSession'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/SignInRejectedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Resolve the current local session
      description: Resolves the current enabled user and current installation-wide role on every call.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current safe session context with no session identifier.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/BrowserStateUpdate'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              examples:
                administrator:
                  $ref: '#/components/examples/AdministratorSession'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current local session
      description: Requires exact same-origin metadata and the session-bound X-Stackplore-CSRF proof.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Current session revoked and its browser cookie cleared.
          headers:
            Set-Cookie:
              description: Clears the session cookie with the same host-only path and policy attributes.
              schema:
                type: string
                minLength: 1
                maxLength: 1024
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/recent-grants:
    post:
      operationId: createRecentAuthGrant
      summary: Reauthenticate for one high-risk change
      description: >-
        Verifies the current password and returns one short-lived, one-use proof bound to the
        current user, current session, and exact purpose. Exact same-origin metadata and the
        session-bound X-Stackplore-CSRF proof are required.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecentAuthRequest'
            examples:
              passwordChange:
                summary: Reauthenticate for a password change
                value:
                  current_password: correct-horse-demo
                  purpose: account.password_change
      responses:
        '201':
          description: A one-use recent-authentication proof was issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/BrowserStateUpdate'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentAuthResponse'
              examples:
                issued:
                  summary: One-use proof issued
                  value:
                    recent_auth_proof: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    purpose: account.password_change
                    expires_at: 2026-01-02T03:09:05Z
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /auth/password:
    patch:
      operationId: changeOwnPassword
      summary: Change the current user's password
      description: >-
        Consumes an account.password_change recent-authentication proof, rotates the current
        session, and revokes every other session and grant for the current user.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
          RecentAuthProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnPassphraseChangeRequest'
            examples:
              passwordChange:
                summary: Set a new local password
                value:
                  new_password: another-correct-horse
      responses:
        '200':
          description: Password changed and the current session rotated.
          headers:
            Set-Cookie:
              description: Replaces the current opaque session cookie using the fixed session policy.
              schema:
                type: string
                minLength: 1
                maxLength: 1024
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              examples:
                rotated:
                  $ref: '#/components/examples/AdministratorSession'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /users:
    get:
      operationId: listUsers
      summary: List local users
      description: Requires the current enabled user to have the administrator role.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserCursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/UserRoleFilter'
        - $ref: '#/components/parameters/UserEnabledFilter'
      responses:
        '200':
          description: Bounded page of local users in canonical login order.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/BrowserStateUpdate'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                firstPage:
                  summary: One enabled administrator
                  value:
                    items:
                      - id: usr_demo_01
                        login_name: operator
                        display_name: Operations
                        role: administrator
                        enabled: true
                        created_at: 2026-01-02T03:04:05Z
                        updated_at: 2026-01-02T03:04:05Z
                        version: 1
                    page:
                      limit: 50
                      has_more: false
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
    post:
      operationId: createUser
      summary: Create a local user
      description: >-
        Requires an administrator and consumes a user.create recent-authentication proof in the
        same transaction as the user and audit records.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
          RecentAuthProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              viewer:
                summary: Create an enabled viewer
                value:
                  login_name: viewer01
                  display_name: On-call Viewer
                  role: viewer
                  password: correct-horse-viewer
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /users/{user_id}:
    get:
      operationId: getUser
      summary: Inspect one local user
      description: Requires the current enabled user to have the administrator role.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserFound'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
    patch:
      operationId: updateUser
      summary: Change one local user
      description: >-
        Requires an administrator, If-Match, and a user.update recent-authentication proof. Role,
        login, or enabled-state changes revoke every session and grant for the target user. The
        last enabled administrator cannot be disabled or demoted.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
          RecentAuthProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              disableViewer:
                summary: Disable a local viewer
                value:
                  enabled: false
      responses:
        '200':
          $ref: '#/components/responses/UserFound'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
    delete:
      operationId: deleteUser
      summary: Delete one local user
      description: >-
        Requires an administrator, If-Match, and a user.delete recent-authentication proof. The
        last enabled administrator cannot be deleted. Every target session and grant is revoked.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
          RecentAuthProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          $ref: '#/components/responses/MutationAccepted'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /users/{user_id}/password-reset:
    post:
      operationId: resetUserPassword
      summary: Reset one local user's password
      description: >-
        Requires an administrator, If-Match, and a user.password_reset recent-authentication
        proof. Every session and grant for the target user is revoked.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
          RecentAuthProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassphraseRequest'
            examples:
              administratorReset:
                summary: Set a replacement local password
                value:
                  new_password: replacement-correct-horse
      responses:
        '204':
          $ref: '#/components/responses/MutationAccepted'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /users/{user_id}/sessions:
    delete:
      operationId: revokeUserSessions
      summary: Revoke every session for one local user
      description: >-
        Requires an administrator and a user.sessions_revoke recent-authentication proof. No
        session identifier is accepted or returned.
      security:
        - BrowserSession: []
          CSRFRequestProof: []
          RecentAuthProof: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          $ref: '#/components/responses/MutationAccepted'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /sources:
    get:
      operationId: listSources
      summary: List configured infrastructure sources
      description: Public only in an explicitly isolated guest demonstration; normal installations require a browser session. Returns safe bounded source summaries for any authenticated local user.
      security:
        - BrowserSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Bounded source summaries.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/BrowserStateUpdate'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                maxItems: 64
                items:
                  $ref: '#/components/schemas/SourceSummary'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'
  /environments:
    get:
      operationId: listEnvironments
      summary: List normalized environments
      description: Public only in an explicitly isolated guest demonstration; normal installations require a browser session. Returns one cursor-bound page of safe provider-neutral environment summaries.
      security:
        - BrowserSession: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProductSourceSelection'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 4096
            pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: One bounded normalized environment page.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/BrowserStateUpdate'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvironmentPage'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
