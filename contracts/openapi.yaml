  /settings/sources/{source_id}:
    patch:
      operationId: updateSourceSettings
      summary: Commit one exact source collection change
      description: Consumes the exact preview confirmation and a source.update recent-authentication grant in the same PostgreSQL transaction as the versioned toggle and durable audit fact. Expired, replayed, other-session and other-target confirmations are rejected. No provider write occurs. History is retained; ongoing stale captures cannot commit after a change.
