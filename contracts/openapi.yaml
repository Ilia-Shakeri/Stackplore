        - configuration_source
        - delivery_semantics
        - matrix
      properties:
        matrix:
          $ref: '#/components/schemas/MatrixNotificationSettingsStatus'
        adapter:
          type: string
          const: generic_webhook
        enabled:
          type: boolean
          const: true
        destination_reference_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
        configuration_source:
          type: string
          const: operator_environment
        delivery_semantics:
          type: string
          const: at_least_once
    DisabledNotificationSettingsStatus:
      type: object
      description: Disabled generic webhook with no destination material exposed.
      additionalProperties: false
      required:
        - adapter
        - enabled
        - configuration_source
        - delivery_semantics
        - matrix
      properties:
        matrix:
          $ref: '#/components/schemas/MatrixNotificationSettingsStatus'
        adapter:
          type: string
          const: generic_webhook
        enabled:
          type: boolean
          const: false
        configuration_source:
          type: string
          const: operator_environment
        delivery_semantics:
          type: string
          const: at_least_once
    MatrixNotificationSettingsStatus:
      description: Secret-free Matrix delivery status; origin, room, and access token stay with the operator.
      oneOf:
        - $ref: '#/components/schemas/ConfiguredMatrixNotificationSettingsStatus'
        - $ref: '#/components/schemas/DisabledMatrixNotificationSettingsStatus'
    ConfiguredMatrixNotificationSettingsStatus:
      type: object
      description: Enabled Matrix lane and safe reference.
      additionalProperties: false
      required: [adapter, enabled, destination_reference_id]
      properties:
        adapter:
          type: string
          const: matrix
        enabled:
          type: boolean
          const: true
        destination_reference_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
    DisabledMatrixNotificationSettingsStatus:
      type: object
      description: Disabled Matrix lane.
      additionalProperties: false
      required: [adapter, enabled]
      properties:
        adapter:
          type: string
          const: matrix
        enabled:
          type: boolean
          const: false
    ProductAlertChange:
      type: object
      description: Committed source-scoped change metadata; refetch authoritative paginated HTTP data.
      additionalProperties: false
      required: [id, source_id, rule_id, kind, occurred_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}$
        source_id:
          $ref: '#/components/schemas/SourceId'
        rule_id:
          $ref: '#/components/schemas/AlertRuleId'
        alert_id:
          $ref: '#/components/schemas/AlertId'
        kind:
          type: string
          enum: [alert.changed, rule.created, rule.changed, rule.deleted]
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ProductAlertChangesEnvelope:
      type: object
      description: alerts.changed.v1 SSE data. Frame ID equals last committed change ID in data.
      additionalProperties: false
      required: [version, topic, observed_at, data]
      properties:
        version:
          type: integer
          const: 1
          minimum: 1
          maximum: 1
        topic:
          type: string
          const: alerts
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProductAlertChange'
    ProductAlertSnapshotEnvelope:
      type: object
      description: alerts.snapshot.v1 SSE data; data is a bounded first page, never a complete-list claim.
      additionalProperties: false
      required: [version, topic, observed_at, data]
      properties:
        version:
          type: integer
          const: 1
          minimum: 1
          maximum: 1
        topic:
          type: string
          const: alerts
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          $ref: '#/components/schemas/ProductAlertPage'
    NotificationTestResponse:
      type: object
      description: Safe acknowledgement for one durably queued test delivery.
      additionalProperties: false
      required:
        - notification_id
        - destination_reference_id
        - state
      properties:
        notification_id:
          $ref: '#/components/schemas/NotificationId'
        destination_reference_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
        state:
          type: string
          const: queued
    ProductAuditPage:
      type: object
      description: Newest-first protected audit history page.
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    SystemReadiness:
      type: object
      description: Administrator-only detailed readiness with a fixed check order.
      additionalProperties: false
      required:
        - state
        - checks
      properties:
        state:
          $ref: '#/components/schemas/ReadinessState'
        checks:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - $ref: '#/components/schemas/ConfigurationReadinessCheck'
            - $ref: '#/components/schemas/DatabaseReadinessCheck'
            - $ref: '#/components/schemas/ServiceReadinessCheck'
          items: false
    Code:
      type: string
      description: Stable bounded machine code. Consumers must handle unknown valid codes.
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9._-]{0,63}$
      examples:
        - validation_failed
    NamespacedCode:
      type: string
      description: Stable bounded domain code with at least two lowercase segments.
      minLength: 3
      maxLength: 96
      pattern: ^[a-z][a-z0-9_-]*(?:\.[a-z][a-z0-9_-]*)+$
      examples:
        - resource.unavailable
    RequestId:
      type: string
      description: Safe request correlation identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - req_demo_01
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp.
      minLength: 20
      maxLength: 30
      pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?Z$
      examples:
        - 2026-01-02T03:04:05Z
    Cursor:
      type: string
      description: Opaque server-owned continuation cursor.
      minLength: 1
      maxLength: 4096
      pattern: ^(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-][AQgw]|[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048])?$
      examples:
        - bmV4dA
    DisplayText:
      type: string
      description: Trimmed non-empty display text with a visible base character.
      minLength: 1
      maxLength: 256
      pattern: '^(?=\P{White_Space})(?!.*\p{White_Space}$)(?=.*[\p{L}\p{N}\p{P}\p{S}])(?:[^\p{Cc}\p{Cf}\p{Zl}\p{Zp}]|\u200C|\u200D)+$'
    OptionalDisplayText:
      type: string
      description: Empty or trimmed display text with a visible base character.
      maxLength: 8192
      pattern: '^(?:$|(?=\P{White_Space})(?!.*\p{White_Space}$)(?=.*[\p{L}\p{N}\p{P}\p{S}])(?:[^\p{Cc}\p{Cf}\p{Zl}\p{Zp}]|\u200C|\u200D)+)$'
    SourceId:
      type: string
      description: Stable opaque infrastructure source identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - src_demo_01
    EnvironmentId:
      type: string
      description: Stable opaque environment identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - env_demo_01
    ResourceId:
      type: string
      description: Stable opaque resource identifier.
      minLength: 46
      maxLength: 46
      pattern: ^r1_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      examples:
        - r1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    RelationshipId:
      type: string
      description: Stable opaque relationship identifier.
      minLength: 48
      maxLength: 48
      pattern: ^rel1_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      examples:
        - rel1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    EvidenceId:
      type: string
      description: Stable opaque evidence identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - evidence_demo_01
    LogEntryId:
      type: string
      description: Stable opaque log entry identifier within its source evidence.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - log_demo_01
    MetricSampleId:
      type: string
      description: Stable opaque metric sample identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - metric_demo_01
    EventId:
      type: string
      description: Stable opaque infrastructure event identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - event_demo_01
    AlertRuleId:
      type: string
      description: Stable opaque alert rule identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - rule_demo_01
    AlertId:
      type: string
      description: Stable opaque alert identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - alert_demo_01
    NotificationId:
      type: string
      description: Stable opaque notification identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - notification_demo_01
    AuditEntryId:
      type: string
      description: Stable opaque audit entry identifier.
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      examples:
        - audit_demo_01
    ProviderKind:
      type: string
      description: Supported infrastructure provider family.
      enum:
        - demo
        - docker
        - kubernetes
    ScopeKind:
      type: string
      description: Normalized provider scope family.
      enum:
        - global
        - project
        - namespace
    AvailabilityState:
      type: string
      description: Current support and access state, separate from resource health.
      enum:
        - available
        - stale
        - unavailable
        - unsupported
        - permission_denied
    HealthState:
      type: string
      description: Normalized resource health state.
      enum:
        - healthy
        - degraded
        - unhealthy
        - unknown
    EvidenceStatus:
      type: string
      description: Result carried by one bounded item of health evidence.
      enum:
        - positive
        - negative
        - unknown
    RelationshipDirection:
      type: string
      description: Direction represented by a relationship.
      enum:
        - source_to_target
        - bidirectional
        - undirected
    RelationshipKind:
      type: string
      description: Normalized relationship meaning shared by all providers.
      enum:
        - owns
        - selects
        - routes_to
        - depends_on
        - mounts
        - references
        - member_of
    RelationshipProvenance:
      type: string
      description: Reviewed source of relationship evidence.
      enum:
        - ownership
        - selector
        - route
        - annotation
        - declared_dependency
        - storage_reference
        - network_membership
        - endpoint
    EvidenceCertainty:
      type: string
      description: Whether evidence is explicit or inferred.
      enum:
        - explicit
        - inferred
    MetricName:
      type: string
      description: Fixed normalized metric name for version 1.
      enum:
        - cpu.usage.cores
        - memory.usage.bytes
        - network.receive.bytes_total
        - network.send.bytes_total
        - restart.count
        - cpu.request.cores
        - cpu.limit.cores
        - memory.request.bytes
        - memory.limit.bytes
    MetricUnit:
      type: string
      description: Normalized unit for a metric value.
      enum:
        - cores
        - bytes
        - count
    CapabilityName:
      type: string
      description: Fixed observation capability set for version 1.
      enum:
        - inventory.list
        - inventory.detail
        - health.read
        - topology.read
        - log.read
        - log.tail
        - metric.current
        - metric.history
        - event.history
        - event.watch
    LogStream:
      type: string
      description: Provider stream that supplied a log entry.
      enum:
        - stdout
        - stderr
        - system
        - unknown
    LogSeverity:
      type: string
      description: Detected log severity when one can be determined.
      enum:
        - trace
        - debug
        - info
        - warning
        - error
        - critical
        - unknown
    EventSeverity:
      type: string
      description: Normalized infrastructure event severity.
      enum:
        - debug
        - info
        - warning
        - error
        - critical
    AlertState:
      type: string
      description: Alert lifecycle state.
      enum:
        - pending
        - firing
        - acknowledged
        - resolved
    AuditActorKind:
      type: string
      description: Kind of principal responsible for an audited event.
      enum:
        - user
        - system
        - operator
    AuditOutcome:
      type: string
      description: Safe normalized audit outcome.
      enum:
        - intent
        - success
        - failure
        - denied
        - uncertain
    SortDirection:
      type: string
      description: Direction for one operation-owned sort field.
      enum:
        - asc
        - desc
    Completeness:
      type: string
      description: Whether a bounded provider read returned every allowed result.
      enum:
        - complete
        - partial
    AvailableCompleteObservation:
      type: object
      description: Complete provider data that is currently available.
      additionalProperties: false
      required:
        - state
        - completeness
        - observed_at
      properties:
        state:
          type: string
          const: available
        completeness:
          type: string
          const: complete
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        reason_code:
          $ref: '#/components/schemas/NamespacedCode'
    AvailablePartialObservation:
      type: object
      description: Partial provider data that is currently available.
      additionalProperties: false
      required:
        - state
        - completeness
        - observed_at
        - reason_code
      properties:
        state:
          type: string
          const: available
        completeness:
          type: string
          const: partial
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        reason_code:
          $ref: '#/components/schemas/NamespacedCode'
    StaleObservation:
      type: object
      description: Complete or partial provider data that is no longer current.
      additionalProperties: false
      required:
        - state
        - completeness
        - observed_at
        - reason_code
      properties:
        state:
          type: string
          const: stale
        completeness:
          $ref: '#/components/schemas/Completeness'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        reason_code:
          $ref: '#/components/schemas/NamespacedCode'
    UnavailableObservation:
      type: object
      description: Provider data that cannot be returned for a known safe reason.
      additionalProperties: false
      required:
        - state
        - completeness
        - observed_at
        - reason_code
      properties:
        state:
          type: string
          enum:
            - unavailable
            - unsupported
            - permission_denied
        completeness:
          type: string
          const: complete
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        reason_code:
          $ref: '#/components/schemas/NamespacedCode'
    ObservationStatus:
      description: Valid availability and completeness state for one bounded provider read.
      oneOf:
        - $ref: '#/components/schemas/AvailableCompleteObservation'
        - $ref: '#/components/schemas/AvailablePartialObservation'
        - $ref: '#/components/schemas/StaleObservation'
        - $ref: '#/components/schemas/UnavailableObservation'
    InfrastructureSource:
      type: object
      description: Safe non-secret configured infrastructure source.
      additionalProperties: false
      required:
        - id
        - provider
        - display_name
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/SourceId'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        display_name:
          $ref: '#/components/schemas/DisplayText'
          description: Human-selected safe source name.
        synthetic:
          type: boolean
          description: Whether all source evidence is synthetic demonstration data.
    Environment:
      type: object
      description: Provider-neutral infrastructure environment.
      additionalProperties: false
      required:
        - id
        - source_id
        - provider
        - display_name
        - status
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/EnvironmentId'
        source_id:
          $ref: '#/components/schemas/SourceId'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        display_name:
          $ref: '#/components/schemas/DisplayText'
          description: Safe display name that is not part of identity.
        status:
          $ref: '#/components/schemas/ObservationStatus'
        synthetic:
          type: boolean
          description: Whether the environment comes from demonstration data.
    GlobalScope:
      type: object
      description: Provider-neutral global scope with no identity name.
      additionalProperties: false
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          const: global
        name:
          type: string
          const: ''
    NamedScope:
      type: object
      description: Provider-neutral project or namespace scope.
      additionalProperties: false
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum:
            - project
            - namespace
        name:
          $ref: '#/components/schemas/DisplayText'
          description: Safe project or namespace identity name.
    Scope:
      description: Valid provider-neutral namespace, project, or global scope.
      oneOf:
        - $ref: '#/components/schemas/GlobalScope'
        - $ref: '#/components/schemas/NamedScope'
    ResourceIdentity:
      type: object
      description: Safe public identity for a provider-neutral resource.
      additionalProperties: false
      required:
        - id
        - provider
        - source_id
        - environment_id
        - scope
        - kind
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        source_id:
          $ref: '#/components/schemas/SourceId'
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
        scope:
          $ref: '#/components/schemas/Scope'
        kind:
          $ref: '#/components/schemas/NamespacedCode'
    Resource:
      type: object
      description: Provider-neutral resource with no raw provider payload.
      additionalProperties: false
      required:
        - identity
        - display_name
        - synthetic
      properties:
        identity:
          $ref: '#/components/schemas/ResourceIdentity'
        display_name:
          $ref: '#/components/schemas/DisplayText'
          description: Safe display name that is not part of identity.
        synthetic:
          type: boolean
          description: Whether the resource comes from demonstration data.
    ResourceSnapshot:
      type: object
      description: One resource and the availability of its observed state.
      additionalProperties: false
      required:
        - resource
        - status
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        status:
          $ref: '#/components/schemas/ObservationStatus'
    HealthEvidence:
      type: object
      description: One bounded, safe fact used to calculate health.
      additionalProperties: false
      required:
        - id
        - code
        - source_code
        - status
        - observed_at
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/EvidenceId'
        code:
          $ref: '#/components/schemas/NamespacedCode'
        source_code:
          $ref: '#/components/schemas/NamespacedCode'
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        synthetic:
          type: boolean
          description: Whether the evidence comes from demonstration data.
    KnownHealthSnapshot:
      type: object
      description: Known health backed by evidence from readable provider data.
      additionalProperties: false
      required:
        - resource_id
        - state
        - status
        - evidence
      properties:
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        state:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
        status:
          oneOf:
            - $ref: '#/components/schemas/AvailableCompleteObservation'
            - $ref: '#/components/schemas/AvailablePartialObservation'
            - $ref: '#/components/schemas/StaleObservation'
        evidence:
          type: array
          description: Reviewed evidence only; raw provider objects are forbidden.
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/HealthEvidence'
    DataAllowedUnknownHealthSnapshot:
      type: object
      description: Unknown health from readable provider data, with optional reviewed evidence.
      additionalProperties: false
      required:
        - resource_id
        - state
        - status
        - evidence
      properties:
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        state:
          type: string
          const: unknown
        status:
          oneOf:
            - $ref: '#/components/schemas/AvailableCompleteObservation'
            - $ref: '#/components/schemas/AvailablePartialObservation'
            - $ref: '#/components/schemas/StaleObservation'
        evidence:
          type: array
          description: Reviewed evidence only; raw provider objects are forbidden.
          maxItems: 32
          items:
            $ref: '#/components/schemas/HealthEvidence'
    NoDataUnknownHealthSnapshot:
      type: object
      description: Unknown health when provider data is unavailable, unsupported, or denied.
      additionalProperties: false
      required:
        - resource_id
        - state
        - status
        - evidence
      properties:
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        state:
          type: string
          const: unknown
        status:
          $ref: '#/components/schemas/UnavailableObservation'
        evidence:
          type: array
          description: Empty because the provider state does not allow data.
          maxItems: 0
          items:
            $ref: '#/components/schemas/HealthEvidence'
    UnknownHealthSnapshot:
      description: Unknown health split by whether the provider state allows data.
      oneOf:
        - $ref: '#/components/schemas/DataAllowedUnknownHealthSnapshot'
        - $ref: '#/components/schemas/NoDataUnknownHealthSnapshot'
    HealthSnapshot:
      description: Health at one observed point, separate from data availability.
      oneOf:
        - $ref: '#/components/schemas/KnownHealthSnapshot'
        - $ref: '#/components/schemas/UnknownHealthSnapshot'
    DataAllowedHealthResult:
      type: object
      description: Bounded health snapshots from a data-allowed provider read.
      additionalProperties: false
      required:
        - status
        - items
      properties:
        status:
          oneOf:
            - $ref: '#/components/schemas/AvailableCompleteObservation'
            - $ref: '#/components/schemas/AvailablePartialObservation'
            - $ref: '#/components/schemas/StaleObservation'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/HealthSnapshot'
    NoDataHealthResult:
      type: object
      description: Empty health result when provider data is not allowed.
      additionalProperties: false
      required:
        - status
        - items
      properties:
        status:
          $ref: '#/components/schemas/UnavailableObservation'
        items:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/HealthSnapshot'
    HealthResult:
      description: Health result split by whether the provider status allows data.
      oneOf:
        - $ref: '#/components/schemas/DataAllowedHealthResult'
        - $ref: '#/components/schemas/NoDataHealthResult'
    RelationshipEvidence:
      type: object
      description: Provenance and confidence for one relationship fact.
      additionalProperties: false
      required:
        - id
        - provider
        - source_id
        - provenance
        - certainty
        - confidence
        - observed_at
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/EvidenceId'
        provider:
          $ref: '#/components/schemas/ProviderKind'
        source_id:
          $ref: '#/components/schemas/SourceId'
        provenance:
          $ref: '#/components/schemas/RelationshipProvenance'
        certainty:
          $ref: '#/components/schemas/EvidenceCertainty'
        confidence:
          type: number
          description: Normalized confidence from zero through one.
          minimum: 0
          maximum: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        synthetic:
          type: boolean
          description: Whether the evidence comes from demonstration data.
    Relationship:
      type: object
      description: Typed edge retaining all bounded evidence.
      additionalProperties: false
      required:
        - id
        - source_resource_id
        - target_resource_id
        - type
        - direction
        - evidence
        - observed_at
      properties:
        id:
          $ref: '#/components/schemas/RelationshipId'
        source_resource_id:
          $ref: '#/components/schemas/ResourceId'
        target_resource_id:
          $ref: '#/components/schemas/ResourceId'
        type:
          $ref: '#/components/schemas/RelationshipKind'
        direction:
          $ref: '#/components/schemas/RelationshipDirection'
        evidence:
