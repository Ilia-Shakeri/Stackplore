      additionalProperties: false
      required:
        - items
        - page
        - status
      properties:
        items:
          type: array
          description: Events ordered by occurrence time descending, then event ID ascending.
          maxItems: 200
          items:
            $ref: '#/components/schemas/InfrastructureEvent'
        page:
          $ref: '#/components/schemas/PageInfo'
        status:
          oneOf:
            - $ref: '#/components/schemas/AvailableCompleteObservation'
            - $ref: '#/components/schemas/AvailablePartialObservation'
            - $ref: '#/components/schemas/StaleObservation'
    NoDataEventPage:
      type: object
      description: Empty final event page when provider data is not allowed.
      additionalProperties: false
      required:
        - items
        - page
        - status
      properties:
        items:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/InfrastructureEvent'
        page:
          $ref: '#/components/schemas/FinalPageInfo'
        status:
          $ref: '#/components/schemas/UnavailableObservation'
    EventPage:
      description: Event page split by whether the provider status allows data.
      oneOf:
        - $ref: '#/components/schemas/DataAllowedEventPage'
        - $ref: '#/components/schemas/NoDataEventPage'
    ActiveAlert:
      type: object
